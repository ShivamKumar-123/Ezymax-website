<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ezymex chart</title>
<!--
  The licensed TradingView Advanced Charts, inside the app, behind the same bridge the app's own chart uses
  (lib/features/terminal/chart/chart_bridge.dart). It is the same library and version the web terminal runs,
  copied into assets/chart/tv/ by scripts/sync-assets.mjs and served from the loopback server in
  chart_server.dart - the library needs a real origin for its iframe, which a file:// page cannot give it.

  The chart has no data of its own and reaches nothing over the network. Every bar, tick and line arrives from
  Flutter through window.K.recv / window.K.batch, so the prices on the chart are by construction the prices
  everywhere else in the app: the same market-data stream, in the same spread group.

  Gestures go back on the EzymexChart channel, unchanged, so the Flutter side does not know which chart is
  drawing. When the library is missing from a build the app loads chart.html instead and nothing here runs.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #chart { position: absolute; inset: 0; }
  /* Shown only if the library never starts: a dark panel rather than a white flash behind the terminal. */
  #fail { position: absolute; inset: 0; display: none; place-items: center; color: #8b929e;
          font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  /* Ours, over the library's frame: the TP / SL handles of a trade without a stop, and the ghost stop a handle
     drags out. The frame swallows every pointer event, so only these elements take them. */
  #ov { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden;
        font: 600 11px/1 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hd { position: absolute; pointer-events: auto; touch-action: none; display: flex; align-items: center;
        height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid; background: rgba(10,10,13,0.92);
        transform: translateY(-50%); letter-spacing: 0.02em; user-select: none; -webkit-user-select: none; }
  .hd.on { filter: brightness(1.25); }
  .chip { position: absolute; pointer-events: auto; touch-action: none; display: flex; align-items: center; gap: 6px;
          height: 22px; padding: 0 3px 0 8px; border-radius: 6px; border: 1px solid; background: rgba(10,10,13,0.92);
          transform: translateY(-50%); white-space: nowrap; max-width: 62vw; user-select: none; -webkit-user-select: none; }
  .chip.on { filter: brightness(1.25); }
  .chip .nt { font-weight: 500; }
  .chip .x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-size: 14px;
             line-height: 1; opacity: 0.85; }
  #ghost { position: absolute; left: 0; top: 0; display: none; border-top: 1px dashed; width: 100%; }
  #glabel { position: absolute; left: 0; top: 0; display: none; padding: 4px 7px; border-radius: 6px; color: #fff;
            font: 600 11px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="fail">The chart could not start.</div>
<div id="ov"><div id="ghost"></div><div id="glabel"></div></div>
<script src="tv/charting_library.standalone.js"></script>
<script>
(() => {
  "use strict";

  const post = (m) => { try { window.EzymexChart.postMessage(JSON.stringify(m)); } catch (_) {} };

  /* ----------------------------------------------------------------- timeframes */

  // The app's timeframe names and TradingView's resolutions are the same ladder under two spellings.
  const TF_TO_RES = { M1: "1", M5: "5", M15: "15", M30: "30", H1: "60", H4: "240", D1: "1D", W1: "1W", MN: "1M" };
  const resOf = (tf) => TF_TO_RES[String(tf || "").toUpperCase()] || "1";

  /* ----------------------------------------------------------------- state */

  let widget = null;          // the TradingView widget, once init has told us what to draw
  let chart = null;           // its active chart, once it is ready
  let cfg = null;             // the init message
  let bars = [];              // every bar we hold, oldest first
  let onTick = null;          // the datafeed's realtime callback
  let olderWait = null;       // the getBars resolver waiting for an `older` message
  let firstWait = null;       // the first getBars, parked until the app's `bars` message has arrived
  let exhausted = false;      // the app has told us there is no more history
  const lines = new Map();    // id -> { entity, price, key }: one horizontal_line shape per trade line
  const studies = new Map();  // uid -> study id
  // What arrived before the library was ready to draw it. The app sends lines and quotes the moment it has
  // them, which can be before TradingView has finished starting, and a line that came then must not be lost.
  let lastLines = null, lastQuote = null, lastIndicators = null;
  // The Buy price line: { id, price }, id null while the library is still creating it.
  let askLine = null;

  const palette = () => (cfg && cfg.palette) || {};
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);

  /* ----------------------------------------------------------------- datafeed */

  // Everything here is answered out of what Flutter has already sent. Nothing is fetched.
  const datafeed = {
    onReady: (cb) => setTimeout(() => cb({
      supported_resolutions: Object.values(TF_TO_RES),
      supports_marks: false,
      supports_timescale_marks: false,
      supports_time: true,
    }), 0),

    searchSymbols: (_a, _b, _c, cb) => cb([]),

    resolveSymbol: (_name, onResolve) => setTimeout(() => onResolve({
      name: cfg.symbol || "",
      ticker: cfg.symbol || "",
      description: cfg.symbol || "",
      type: "forex",
      session: "24x7",
      timezone: "Etc/UTC",
      exchange: "",
      listed_exchange: "",
      format: "price",
      // `digits` is the instrument's own precision, so the axis reads exactly as the rest of the app does
      pricescale: Math.pow(10, Number(cfg.digits) || 5),
      minmov: 1,
      has_intraday: !!cfg.intraday,
      has_weekly_and_monthly: true,
      supported_resolutions: Object.values(TF_TO_RES),
      data_status: "streaming",
    }), 0),

    getBars: (_symbol, _res, period, onHistory, onError) => {
      if (period.firstDataRequest) {
        if (bars.length) return onHistory(bars.slice(), { noData: false });
        // The library asks before the app has sent its history. Answering "no data" here would be believed -
        // the library then stops asking - so the request is parked and answered when the bars arrive.
        firstWait = { onHistory, onError };
        return;
      }
      // Scroll-back: the app owns the history, so it is asked and the answer is awaited. Only one request is
      // ever in flight, which is what TradingView does anyway.
      if (olderWait) return onError("busy");
      if (exhausted || bars.length === 0) return onHistory([], { noData: true });
      olderWait = { onHistory, onError };
      post({ type: "older", before: Math.floor(bars[0].time / 1000) });
    },

    subscribeBars: (_symbol, _res, cb) => { onTick = cb; },
    unsubscribeBars: () => { onTick = null; },
  };

  /* ----------------------------------------------------------------- theme */

  // A colour at `a` opacity, for the volume bars and the area fill (hex or rgba in; the palette sends both).
  function fade(colour, a) {
    const hex = /^#([0-9a-f]{6})$/i.exec(colour || "");
    if (hex) return `rgba(${parseInt(hex[1].slice(0, 2), 16)},${parseInt(hex[1].slice(2, 4), 16)},${parseInt(hex[1].slice(4, 6), 16)},${a})`;
    const m = /^rgba?\(([^)]+)\)/i.exec(colour || "");
    if (!m) return colour;
    const [r, g, b] = m[1].split(",").map((x) => x.trim());
    return `rgba(${r},${g},${b},${a})`;
  }

  // The web terminal's chart colours (apps/terminal/lib/tv/style.ts chartOverrides): rising candles in the buy
  // blue, falling in red, the same grid and scales, the last price as one red dashed line with its badge. The
  // palette's `up` green stays for P&L and TP lines; it is not the candle colour on either platform.
  function overrides() {
    const p = palette();
    const up = p.buy || "#4a7bff", down = p.down || "#f04438";
    const line = p.line || (p.dark === false ? "rgba(15,15,20,0.1)" : "rgba(255,255,255,0.07)");
    const o = {
      "paneProperties.backgroundType": "solid",
      "paneProperties.background": p.bg || (p.dark === false ? "#ffffff" : "#0a0a0d"),
      "paneProperties.vertGridProperties.color": p.grid || line,
      "paneProperties.horzGridProperties.color": p.grid || line,
      "paneProperties.separatorColor": line,
      "paneProperties.crossHairProperties.color": p.fg3 || "#63636e",
      "scalesProperties.textColor": p.fg2 || "#a1a1aa",
      "scalesProperties.lineColor": line,
      "scalesProperties.showSeriesLastValue": true,
      // one number on the scale, the price: an indicator's value was a second badge beside it
      "scalesProperties.showStudyLastValue": false,
      "scalesProperties.showBidAskLabels": false,
      "mainSeriesProperties.showPriceLine": true,
      "mainSeriesProperties.priceLineColor": down,
      "mainSeriesProperties.priceLineWidth": 1,
      "mainSeriesProperties.bidAsk.visible": false,
      "mainSeriesProperties.bidAsk.lineStyle": 1,
      "mainSeriesProperties.bidAsk.lineWidth": 1,
      "mainSeriesProperties.bidAsk.bidLineColor": down,
      "mainSeriesProperties.bidAsk.askLineColor": up,
      "mainSeriesProperties.lineStyle.color": up,
      "mainSeriesProperties.areaStyle.linecolor": up,
      "mainSeriesProperties.areaStyle.color1": fade(up, 0.28),
      "mainSeriesProperties.areaStyle.color2": fade(up, 0.02),
      "mainSeriesProperties.barStyle.upColor": up,
      "mainSeriesProperties.barStyle.downColor": down,
    };
    for (const s of ["candleStyle", "hollowCandleStyle", "haStyle"]) {
      o[`mainSeriesProperties.${s}.upColor`] = up;
      o[`mainSeriesProperties.${s}.downColor`] = down;
      o[`mainSeriesProperties.${s}.borderUpColor`] = up;
      o[`mainSeriesProperties.${s}.borderDownColor`] = down;
      o[`mainSeriesProperties.${s}.wickUpColor`] = up;
      o[`mainSeriesProperties.${s}.wickDownColor`] = down;
    }
    return o;
  }

  // Indicator defaults (style.ts studyOverrides): the volume bars in the candle colours.
  function studyOverrides() {
    const p = palette();
    return { "volume.volume.color.0": fade(p.down || "#f04438", 0.32), "volume.volume.color.1": fade(p.buy || "#4a7bff", 0.32) };
  }

  const STYLE = { candles: 1, bars: 0, line: 2, area: 3 };

  /* ----------------------------------------------------------------- lines */

  const lineColour = (l) => {
    const p = palette();
    if (l.kind === "sl" || l.kind === "osl") return p.down || "#dc2626";
    if (l.kind === "tp" || l.kind === "otp") return p.up || "#16a34a";
    if (l.kind === "alert") return p.warn || "#d97706";
    if (l.kind === "pending") return p.info || p.fg3 || "#8b929e";
    return l.side === "sell" ? (p.down || "#dc2626") : (p.up || "#16a34a");
  };

  // The app's JSON names the flags `drag` and `close` (chart_bridge.dart ChartLine.toJson); the first version of this
  // page read `draggable` and `closable`, so no line could ever be moved or closed from the TradingView chart.
  const canDrag = (l) => l.drag === true || l.draggable === true;
  const canClose = (l) => l.close === true || l.closable === true;

  /** Everything that decides how a line looks, so an unchanged line is left alone between frames. */
  const sigOf = (l) => [l.kind, l.price, l.label, l.note, l.side, canDrag(l), canClose(l)].join("|");

  // Trade lines are horizontal_line shapes with a chip of ours over the frame (overlay below), the way the web
  // terminal draws them (tv-chart.tsx syncShapes + trade-overlay.tsx). The first version used the library's
  // createOrderLine, which drew nothing on a handset while the shapes did; every line now goes the way that works.
  const lineStyle = (l) => (l.kind === "pos" ? 0 : l.kind === "alert" ? 1 : 2);

  /** Moves one line's shape (a drag in progress): the app's own price follows at the drop. */
  function moveShape(id, price) {
    const r = lines.get(id);
    if (!r || !r.entity || !chart) return;
    try {
      const sh = chart.getShapeById(r.entity);
      sh.setPoints([{ price, time: sh.getPoints()[0]?.time }]);
      r.price = price;
    } catch (_) {}
  }

  function drawLines(list) {
    if (!chart) return;
    const want = new Map();
    for (const l of list || []) if (num(l.price) !== null) want.set(l.id, l);
    for (const [id, r] of [...lines]) {
      if (want.has(id)) continue;
      if (r.entity) { try { chart.removeEntity(r.entity); } catch (_) {} }
      lines.delete(id);
    }
    for (const l of want.values()) {
      const colour = lineColour(l);
      const key = colour + "|" + lineStyle(l);
      const r = lines.get(l.id);
      if (r) {
        if (!r.entity) continue; // being created: it picks the latest up when it is there
        try {
          const sh = chart.getShapeById(r.entity);
          if (r.price !== l.price) sh.setPoints([{ price: l.price, time: sh.getPoints()[0]?.time }]);
          if (r.key !== key) sh.setProperties({ linecolor: colour, linestyle: lineStyle(l) });
          r.price = l.price;
          r.key = key;
          continue;
        } catch (_) {
          // the handle is gone (a new layout): drawn afresh below
          try { chart.removeEntity(r.entity); } catch (_) {}
          lines.delete(l.id);
        }
      }
      const rec = { entity: null, price: l.price, key };
      lines.set(l.id, rec);
      let time;
      try { time = Math.floor(chart.getVisibleRange().to); } catch (_) { time = Math.floor(Date.now() / 1000); }
      let made;
      try {
        made = chart.createShape({ price: l.price, time }, {
          shape: "horizontal_line", lock: true, disableSelection: true, disableSave: true, disableUndo: true,
          showInObjectsTree: false, zOrder: "top",
          overrides: { linecolor: colour, linestyle: lineStyle(l), linewidth: 1, showPrice: true, showLabel: false },
        });
      } catch (_) { lines.delete(l.id); continue; }
      Promise.resolve(made).then((id) => {
        if (lines.get(l.id) !== rec) { try { chart.removeEntity(id); } catch (_) {} return; }
        rec.entity = id;
        const now = lastLines && lastLines.find((x) => x.id === l.id);
        if (now && now.price !== rec.price) { rec.price = NaN; drawLines(lastLines); }
      }).catch(() => { if (lines.get(l.id) === rec) lines.delete(l.id); });
    }
    overlay.setLines(list || []);
  }

  /* ----------------------------------------------------------------- over the frame: stop handles, long press */

  // The library's order lines carry the chips, their drag and their x, but nothing to set a stop loss or take profit
  // on a trade that has none - the S / T handles the app's own chart and the web terminal have. Those are drawn
  // here, over the library's frame, at the price's pixel on the main pane: the pane's element and the main price
  // scale's visible range are read from the frame's document, which is ours (the loopback origin), the way the web
  // terminal's trade overlay reads them (apps/terminal/components/chart/tv-chart.tsx tvCoords). A long press on the
  // plot is read there too - the frame swallows every touch, so the listener sits on its document.
  const overlay = (() => {
    const ov = document.getElementById("ov");
    const ghost = document.getElementById("ghost");
    const glabel = document.getElementById("glabel");
    const raf = typeof requestAnimationFrame === "function" ? requestAnimationFrame : (f) => setTimeout(f, 16);
    let doc = null;            // the frame's document, once the chart is ready
    let rect = null;           // the main pane's box in page pixels, plus the price scale's width
    let cal = 0;               // the crosshair's correction to our mapping
    let shown = [];            // the app's lines, as last drawn
    let held = null;           // lines that arrived while a handle was dragged: drawn at the drop
    let drag = null;           // the handle drag in progress
    const handles = new Map(); // "id|which" -> element
    const chips = new Map();   // id -> element
    let loopOn = false;

    const mainPane = () => {
      const panes = chart.getPanes();
      const i = panes.findIndex((p) => p.hasMainSeries());
      return { api: panes[i] || null, el: doc.querySelectorAll(".chart-markup-table.pane")[i] || null };
    };
    function measure() {
      try {
        const el = mainPane().el;
        if (!el) { rect = null; return; }
        const r = el.getBoundingClientRect();
        rect = { top: r.top, left: r.left, width: r.width, height: r.height, scaleWidth: doc.documentElement.clientWidth - (r.left + r.width) };
      } catch (_) { rect = null; }
    }
    function scale() {
      if (!rect) return null;
      try {
        const pane = mainPane().api;
        const sc = pane && pane.getMainSourcePriceScale();
        const range = sc && sc.getVisiblePriceRange();
        if (!pane || !sc || !range) return null;
        const mode = sc.getMode();
        if (mode >= 2) return null; // percentage / indexed: prices are not on the axis
        return { range, log: mode === 1, inverted: sc.isInverted(), h: pane.getHeight() || rect.height, top: rect.top };
      } catch (_) { return null; }
    }
    const v = (sc, x) => (sc.log ? Math.log(x) : x);
    function toY(sc, price) {
      if (sc.log && price <= 0) return null;
      const hi = v(sc, sc.range.to), lo = v(sc, sc.range.from);
      if (hi === lo) return null;
      const k = (hi - v(sc, price)) / (hi - lo);
      return sc.top + (sc.inverted ? 1 - k : k) * sc.h + cal;
    }
    function toPrice(sc, y) {
      const hi = v(sc, sc.range.to), lo = v(sc, sc.range.from);
      let k = (y - cal - sc.top) / sc.h;
      if (sc.inverted) k = 1 - k;
      const a = hi - k * (hi - lo);
      return sc.log ? Math.exp(a) : a;
    }
    const digits = () => (cfg && num(cfg.digits) !== null ? cfg.digits : 5);
    const pow = () => Math.pow(10, digits());
    const fmt = (p) => Number(p).toFixed(digits());
    const texts = () => (cfg && cfg.texts) || {};

    /* ---- stops: money and side (chart_bridge.dart ChartStops; the app's own chart does the same) ---- */
    function fmtMoney(x) {
      const a = Math.abs(x).toFixed(2);
      const zero = Number(a) === 0;
      const dot = a.indexOf(".");
      return (x < 0 && !zero ? "-" : x > 0 && !zero ? "+" : "") + a.slice(0, dot).replace(/\B(?=(\d{3})+$)/g, ",") + a.slice(dot);
    }
    const stopMoney = (st, p) => ((p - st.open) * st.k) / (st.inv && p > 0 ? p : 1) + (st.c || 0);
    /** Null when a stop `which` of line l may go to `price`, else [text key, limit] (the engine's check_sltp). */
    function stopProblem(l, which, price) {
      const st = l.stops;
      if (!st) return null;
      const buy = l.side === "buy";
      const q = lastQuote || {};
      const r = st.order ? st.open : buy ? q.bid : q.ask;
      if (!(r > 0)) return null;
      const gap = st.gap || 0;
      const below = (which === "sl") === buy;
      const limit = below ? r - gap : r + gap;
      const eps = 1e-9 * Math.max(1, r);
      const bad = price <= 0 || (below ? price > limit + eps || price >= r - eps : price < limit - eps || price <= r + eps);
      return bad ? [which + (below ? "Below" : "Above"), limit] : null;
    }
    const badText = (b) => (texts()[b[0]] || b[0]).replace("{price}", fmt(b[1]));

    /* ---- the ghost stop while a handle is held ---- */
    let ghostTimer = 0;
    function showGhost(y, tone, text) {
      clearTimeout(ghostTimer);
      const p = palette();
      const col = tone === "bad" ? (p.fg3 || "#8b929e") : tone === "sl" ? (p.down || "#f04438") : (p.up || "#16a34a");
      const yy = Math.round(y);
      ghost.style.display = "block";
      ghost.style.width = (rect ? rect.width : ov.clientWidth) + "px";
      ghost.style.left = (rect ? rect.left : 0) + "px";
      ghost.style.borderTopColor = col;
      ghost.style.transform = `translateY(${yy}px)`;
      glabel.style.display = "block";
      glabel.style.left = (rect ? rect.left : 0) + "px";
      glabel.style.maxWidth = Math.max(80, (rect ? rect.width : ov.clientWidth) - 16) + "px";
      glabel.style.background = tone === "bad" ? (p.label || "#26262e") : col;
      if (glabel.textContent !== text) glabel.textContent = text;
      glabel.style.transform = yy > 40 ? `translate(8px, calc(${yy - 4}px - 100%))` : `translate(8px, ${yy + 4}px)`;
    }
    function hideGhost(after) {
      clearTimeout(ghostTimer);
      const go = () => { ghost.style.display = "none"; glabel.style.display = "none"; };
      if (after) ghostTimer = setTimeout(go, after); else go();
    }

    /* ---- the chips ---- */
    const setText = (el, v) => { if (el.textContent !== v) el.textContent = v; };
    function makeChip() {
      const el = document.createElement("div");
      el.className = "chip";
      el.lb = document.createElement("span");
      el.nt = document.createElement("span");
      el.nt.className = "nt";
      el.x = document.createElement("span");
      el.x.className = "x";
      el.x.textContent = "\u00d7";
      el.append(el.lb, el.nt, el.x);
      // the x: its own pointer, never the chip's drag
      el.x.addEventListener("pointerdown", (e) => e.stopPropagation());
      el.x.addEventListener("pointerup", (e) => { e.stopPropagation(); const l = el.__line; if (l && canClose(l)) post({ type: "close", id: l.id }); });
      el.addEventListener("pointerdown", (e) => { const l = el.__line; if (l && (e.button === 0 || e.pointerType !== "mouse")) startLine(e, l, el); });
      return el;
    }

    /** A finger on a chip: moved, the line follows it and the app hears drag + dragend at the drop (lines the app
     *  may not move stay put); not moved, a tap. The app's lines wait while the chip is held. */
    function startLine(e, l, el) {
      e.preventDefault();
      e.stopPropagation();
      const startY = e.clientY;
      const d0 = drag = { id: l.id, line: true, price: l.price, moved: false };
      el.classList.add("on");
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      const move = (ev) => {
        if (drag !== d0) return;
        if (!d0.moved) {
          if (Math.abs(ev.clientY - startY) <= 4) return;
          d0.moved = true;
          if (canDrag(l)) post({ type: "dragstart", id: l.id });
        }
        if (!canDrag(l)) return;
        const sc = scale();
        if (!sc) return;
        const y = Math.max(sc.top + 2, Math.min(sc.top + sc.h - 2, ev.clientY));
        d0.price = Math.round(toPrice(sc, y) * pow()) / pow();
        moveShape(l.id, d0.price);
      };
      const up = () => {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        el.removeEventListener("pointercancel", up);
        el.removeEventListener("lostpointercapture", up);
        el.classList.remove("on");
        if (drag !== d0) return;
        drag = null;
        if (!d0.moved) {
          if (held) { const h = held; held = null; drawLines(h); }
          post({ type: "tap", id: l.id });
          return;
        }
        // the line stays where it was dropped; the app's next lines say where it really is (the server's answer,
        // or the old price when the move was refused)
        held = null;
        if (!canDrag(l)) return;
        post({ type: "drag", id: l.id, price: d0.price });
        post({ type: "dragend", id: l.id });
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
      el.addEventListener("lostpointercapture", up);
    }

    /* ---- the handles ---- */
    function startStop(e, l, which, el) {
      e.preventDefault();
      e.stopPropagation();
      const sc = scale();
      if (!sc) return;
      const startY = e.clientY;
      const y0 = toY(sc, l.price);
      const hint = which === "sl" ? texts().dragSl || "Drag to set a stop loss" : texts().dragTp || "Drag to set a take profit";
      drag = { id: l.id, which, price: l.price, y: y0 === null ? startY : y0, moved: false, raf: 0 };
      const d0 = drag;
      el.classList.add("on");
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      showGhost(d0.y, which, hint);
      const paint = () => {
        d0.raf = 0;
        if (drag !== d0) return;
        const bad = stopProblem(l, which, d0.price);
        const money = l.stops ? " · " + fmtMoney(stopMoney(l.stops, d0.price)) : "";
        showGhost(d0.y, bad ? "bad" : which, bad ? badText(bad) : which.toUpperCase() + " " + fmt(d0.price) + money);
      };
      const move = (ev) => {
        if (drag !== d0) return;
        if (!d0.moved) {
          if (Math.abs(ev.clientY - startY) <= 4) return;
          d0.moved = true;
        }
        const s2 = scale();
        if (!s2) return;
        const y = Math.max(s2.top + 2, Math.min(s2.top + s2.h - 2, ev.clientY));
        d0.y = y;
        d0.price = Math.round(toPrice(s2, y) * pow()) / pow();
        if (!d0.raf) d0.raf = raf(paint);
      };
      const up = () => {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        el.removeEventListener("pointercancel", up);
        el.removeEventListener("lostpointercapture", up);
        el.classList.remove("on");
        if (drag !== d0) return;
        drag = null;
        if (!d0.moved) {
          hideGhost(1600); // a tap on the handle: the hint stays a moment
        } else {
          const bad = stopProblem(l, which, d0.price);
          if (bad) {
            showGhost(d0.y, "bad", badText(bad) + " · " + (texts().notSent || "Nothing was sent to the server."));
            hideGhost(2400);
          } else {
            hideGhost();
            post({ type: "stop", id: l.id, which, price: d0.price });
          }
        }
        if (held) { const h = held; held = null; drawLines(h); }
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
      el.addEventListener("lostpointercapture", up);
    }

    function render() {
      const want = new Set();
      const sc = rect && scale();
      if (sc) {
        const p = palette();
        for (const l of shown) {
          const price = drag && drag.line && drag.id === l.id ? drag.price : l.price;
          const y = toY(sc, price);
          if (y === null || y < sc.top + 4 || y > sc.top + sc.h - 4) continue;
          // the chip: the label, the money on it, x - at the scale's edge, the way the web terminal places it
          let el = chips.get(l.id);
          if (!el) {
            el = makeChip();
            ov.appendChild(el);
            chips.set(l.id, el);
          }
          want.add(l.id);
          el.__line = l;
          const colour = lineColour(l);
          el.style.color = colour;
          el.style.borderColor = colour;
          setText(el.lb, l.label || "");
          setText(el.nt, l.note || "");
          el.nt.style.display = l.note ? "" : "none";
          el.nt.style.color = l.tone === "down" ? (p.down || "#f04438") : l.tone === "up" ? (p.up || "#16a34a") : colour;
          el.x.style.display = canClose(l) ? "" : "none";
          el.style.right = (rect.scaleWidth + 6) + "px";
          el.style.top = Math.round(y) + "px";
          const chipW = el.offsetWidth || 60;
          for (const which of ["sl", "tp"]) {
            if (!(which === "sl" ? l.addSl : l.addTp)) continue;
            const key = l.id + "|" + which;
            want.add(key);
            let h = handles.get(key);
            if (!h) {
              h = document.createElement("div");
              h.className = "hd";
              h.textContent = which.toUpperCase();
              h.addEventListener("pointerdown", (e) => { const ln = h.__line; if (ln && (e.button === 0 || e.pointerType !== "mouse")) startStop(e, ln, which, h); });
              ov.appendChild(h);
              handles.set(key, h);
            }
            h.__line = l;
            const col = which === "sl" ? (p.down || "#f04438") : (p.up || "#16a34a");
            h.style.color = col;
            h.style.borderColor = col;
            // left of the chip, SL on the left of TP
            const right = rect.scaleWidth + 6 + chipW + 6 + (which === "sl" && l.addTp ? 34 : 0);
            h.style.right = right + "px";
            h.style.top = Math.round(y) + "px";
          }
        }
      }
      for (const [id, el] of [...chips]) {
        if (want.has(id)) continue;
        el.remove();
        chips.delete(id);
      }
      for (const [key, el] of [...handles]) {
        if (want.has(key)) continue;
        el.remove();
        handles.delete(key);
      }
    }
    function loop() {
      if (!loopOn) return;
      try { render(); } catch (_) {}
      raf(loop);
    }

    /* ---- a long press on the plot ---- */
    function longPress() {
      let timer = 0, x0 = 0, y0 = 0;
      doc.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1 || drag) return;
        x0 = e.touches[0].clientX;
        y0 = e.touches[0].clientY;
        clearTimeout(timer);
        timer = setTimeout(() => {
          const sc = scale();
          if (!sc || !rect || y0 < sc.top || y0 > sc.top + sc.h || x0 < rect.left || x0 > rect.left + rect.width) return;
          const p = toPrice(sc, y0);
          if (isFinite(p) && p > 0) post({ type: "long", price: Math.round(p * pow()) / pow() });
        }, 600);
      }, { passive: true });
      const cancel = (e) => {
        if (e && e.touches && e.touches.length && Math.hypot(e.touches[0].clientX - x0, e.touches[0].clientY - y0) < 8) return;
        clearTimeout(timer);
      };
      doc.addEventListener("touchmove", cancel, { passive: true });
      doc.addEventListener("touchend", () => clearTimeout(timer), { passive: true });
      doc.addEventListener("touchcancel", () => clearTimeout(timer), { passive: true });
    }

    return {
      /** Once the chart is ready: find the frame, measure, follow the crosshair, start the loop. */
      start() {
        try {
          const frame = document.querySelector("#chart iframe");
          doc = frame && frame.contentDocument;
        } catch (_) { doc = null; }
        if (!doc) return;
        measure();
        setInterval(measure, 500);
        try {
          // the crosshair says where a price is drawn: keeps the small offset between our mapping and the library's
          chart.crossHairMoved().subscribe(null, (e) => {
            if (!e || num(e.price) === null || num(e.offsetY) === null) return;
            const sc = scale();
            const y = sc && toY(sc, e.price);
            if (y == null) return;
            const err = e.offsetY + (sc.top - cal) - y + cal;
            if (Math.abs(err) < 3) cal = cal * 0.7 + err * 0.3;
          });
        } catch (_) {}
        longPress();
        loopOn = true;
        raf(loop);
      },
      setLines(list) { shown = list; },
      /** Lines from the app wait while a chip or a handle is held: what is under the finger stays there. */
      hold(list) { if (!drag) return false; held = list; return true; },
      /** The check's way in (tool/check-tv-chart.mjs): what a finger would do, without a finger. */
      test: {
        dragLine(id, price) { moveShape(id, price); post({ type: "drag", id, price }); post({ type: "dragend", id }); },
        closeLine(id) { post({ type: "close", id }); },
        chips: () => shown.map((l) => l.id),
      },
    };
  })();
  window.__tvTest = overlay.test;

  /* ----------------------------------------------------------------- the quote */

  // Two price lines, as the web terminal draws them: the Sell price is the library's own price line at the last
  // bar's close (the bars close on the bid), red with its badge; the Buy price is this dotted blue line above it,
  // with no badge. One shape, moved on every quote rather than drawn again.
  function drawQuote(ask) {
    if (!chart || num(ask) === null) return;
    const colour = palette().buy || "#4a7bff";
    if (askLine && askLine.id) {
      if (askLine.price === ask) return;
      try {
        const s = chart.getShapeById(askLine.id);
        s.setPoints([{ price: ask, time: s.getPoints()[0]?.time }]);
        askLine.price = ask;
        return;
      } catch (_) {
        askLine = null; // the handle is gone (a new layout); drawn afresh below
      }
    }
    if (askLine) { askLine.price = ask; return; } // being created: it picks this price up when it is there
    const rec = askLine = { id: null, price: ask };
    let time;
    try { time = Math.floor(chart.getVisibleRange().to); } catch (_) { time = Math.floor(Date.now() / 1000); }
    let made;
    try {
      made = chart.createShape({ price: ask, time }, {
        shape: "horizontal_line", lock: true, disableSelection: true, disableSave: true, disableUndo: true,
        showInObjectsTree: false, zOrder: "top",
        overrides: { linecolor: colour, linestyle: 1, linewidth: 1, showPrice: false, showLabel: false },
      });
    } catch (_) { askLine = null; return; }
    Promise.resolve(made).then((id) => {
      if (askLine !== rec) { try { chart.removeEntity(id); } catch (_) {} return; }
      rec.id = id;
      if (rec.price !== ask) { const latest = rec.price; rec.price = NaN; drawQuote(latest); }
    }).catch(() => { if (askLine === rec) askLine = null; });
  }

  function recolourQuote() {
    if (!chart || !askLine || !askLine.id) return;
    try { chart.getShapeById(askLine.id).setProperties({ linecolor: palette().buy || "#4a7bff" }); } catch (_) {}
  }

  /* ----------------------------------------------------------------- indicators */

  // The app names its indicators as traders do, and so does TradingView, so almost all of them match on the
  // name alone. One that does not is left off rather than drawn as something else, and says so in the console.
  const STUDY = {
    "ma": "Moving Average", "ema": "Moving Average Exponential", "wma": "Moving Average Weighted",
    "smma": "Smoothed Moving Average", "dema": "Double EMA", "tema": "Triple EMA", "hma": "Hull Moving Average",
    "vwap": "VWAP", "ichimoku": "Ichimoku Cloud", "psar": "Parabolic SAR", "supertrend": "SuperTrend",
    "envelopes": "Envelopes", "pivots": "Pivot Points Standard", "bb": "Bollinger Bands",
    "keltner": "Keltner Channels", "donchian": "Donchian Channels", "atr": "Average True Range",
    "stddev": "Standard Deviation", "rsi": "Relative Strength Index", "stoch": "Stochastic",
    "stochrsi": "Stochastic RSI", "macd": "MACD", "cci": "Commodity Channel Index",
    "williams": "Williams %R", "momentum": "Momentum", "roc": "Rate Of Change",
    "adx": "Average Directional Index", "aroon": "Aroon", "ao": "Awesome Oscillator",
    "ac": "Accelerator Oscillator", "obv": "On Balance Volume", "mfi": "Money Flow Index",
    "cmf": "Chaikin Money Flow", "volume": "Volume", "zigzag": "Zig Zag",
  };

  function drawStudies(list) {
    if (!chart) return;
    const seen = new Set();
    for (const ind of list || []) {
      if (!ind || !ind.uid || ind.visible === false) continue;
      seen.add(ind.uid);
      if (studies.has(ind.uid)) continue;
      const name = STUDY[String(ind.type || "").toLowerCase()];
      if (!name) { console.warn("no TradingView study for", ind.type); continue; }
      const inputs = Object.values(ind.params || {}).filter((v) => typeof v === "number" || typeof v === "string");
      studies.set(ind.uid, null);
      chart.createStudy(name, false, false, inputs).then((id) => studies.set(ind.uid, id)).catch(() => studies.delete(ind.uid));
    }
    for (const [uid, id] of [...studies]) {
      if (seen.has(uid)) continue;
      if (id) { try { chart.removeEntity(id); } catch (_) {} }
      studies.delete(uid);
    }
  }

  /* ----------------------------------------------------------------- the widget */

  function build() {
    const p = palette();
    widget = new TradingView.widget({
      container: "chart",
      library_path: "tv/",
      datafeed,
      symbol: cfg.symbol || "",
      interval: resOf(cfg.tf),
      locale: "en",
      autosize: true,
      theme: p.dark === false ? "light" : "dark",
      timezone: "Etc/UTC",
      // The app has its own toolbar, timeframe picker and indicator menu around this view, so the library's
      // own chrome would be a second set of the same controls.
      disabled_features: [
        "header_widget", "left_toolbar", "timeframes_toolbar", "control_bar", "legend_context_menu",
        "symbol_search_hot_key", "compare_symbol", "border_around_the_chart", "popup_hints",
        "go_to_date", "display_market_status", "context_menus",
      ],
      enabled_features: ["hide_left_toolbar_by_default", "iframe_loading_compatibility_mode"],
      overrides: overrides(),
      studies_overrides: studyOverrides(),
      loading_screen: { backgroundColor: p.bg || "#000000", foregroundColor: p.ember || "#f97316" },
      custom_css_url: undefined,
    });

    widget.onChartReady(() => {
      chart = widget.activeChart();
      try { chart.setChartType(STYLE[cfg.chartType] ?? 1); } catch (_) {}
      drawStudies(lastIndicators || cfg.indicators);
      if (lastLines) drawLines(lastLines);
      if (lastQuote) drawQuote(lastQuote.ask);
      overlay.start();
    });
  }

  /* ----------------------------------------------------------------- the bridge */

  function recv(m) {
    if (!m || typeof m !== "object") return;
    switch (m.type) {
      case "init":
        cfg = m;
        if (!widget) build();
        return;

      case "bars": {
        bars = (m.bars || []).map(toBar).filter(Boolean);
        exhausted = false;
        if (firstWait) {
          // the library asked first; this is its answer
          const w = firstWait;
          firstWait = null;
          w.onHistory(bars.slice(), { noData: bars.length === 0 });
          return;
        }
        // A fresh history means a different symbol or timeframe: the library is told to re-read from us.
        if (chart && cfg) { try { chart.resetData(); } catch (_) {} }
        return;
      }

      case "older": {
        const add = (m.bars || []).map(toBar).filter(Boolean);
        exhausted = !!m.exhausted;
        bars = add.concat(bars);
        if (olderWait) {
          const w = olderWait;
          olderWait = null;
          w.onHistory(add, { noData: add.length === 0 });
        }
        return;
      }

      case "bar": {
        const b = toBar(m.bar);
        if (!b) return;
        const last = bars[bars.length - 1];
        if (last && last.time === b.time) bars[bars.length - 1] = b;
        else bars.push(b);
        if (onTick) onTick(b);
        return;
      }

      case "quote": lastQuote = { bid: m.bid, ask: m.ask }; return drawQuote(m.ask);
      case "lines": lastLines = m.lines || []; return overlay.hold(lastLines) ? undefined : drawLines(lastLines);
      case "indicators": lastIndicators = m.indicators || []; return drawStudies(lastIndicators);

      case "chartType":
        if (cfg) cfg.chartType = m.chartType;
        if (chart) { try { chart.setChartType(STYLE[m.chartType] ?? 1); } catch (_) {} }
        return;

      case "palette":
        if (cfg) cfg.palette = m.palette;
        if (!widget) return;
        try {
          widget.changeTheme(m.palette && m.palette.dark === false ? "light" : "dark").then(() => {
            widget.applyOverrides(overrides());
            try { widget.applyStudiesOverrides(studyOverrides()); } catch (_) {}
            recolourQuote();
          });
        } catch (_) {
          try { widget.applyOverrides(overrides()); } catch (_) {}
        }
        return;
    }
  }

  /** The app sends milliseconds; TradingView wants them too, but only for a bar it can use. */
  /**
   * One bar as the app sends it: the array `[t, o, h, l, c, v]` that chart_bridge.dart's `_bar` builds and
   * chart.html reads by index, with `t` in seconds. TradingView wants milliseconds, so seconds are scaled up;
   * an object form is accepted too, so a future sender need not match the array exactly.
   */
  function toBar(b) {
    if (!b) return null;
    const a = Array.isArray(b);
    const t = num(a ? b[0] : (b.t ?? b.time)), o = num(a ? b[1] : (b.o ?? b.open)), h = num(a ? b[2] : (b.h ?? b.high));
    const l = num(a ? b[3] : (b.l ?? b.low)), c = num(a ? b[4] : (b.c ?? b.close));
    if (t === null || o === null || h === null || l === null || c === null) return null;
    const v = num(a ? b[5] : (b.v ?? b.volume));
    return { time: t < 1e11 ? t * 1000 : t, open: o, high: h, low: l, close: c, ...(v === null ? {} : { volume: v }) };
  }

  window.K = {
    recv(msg) { recv(typeof msg === "string" ? JSON.parse(msg) : msg); },
    /** Several commands in one call (the app coalesces quotes, bars and lines to one call per frame). */
    batch(msgs) {
      const list = typeof msgs === "string" ? JSON.parse(msgs) : msgs;
      for (const m of list) recv(m);
    },
  };

  // If the library is not there at all, say so in the app's colours rather than leaving a blank pane.
  if (typeof TradingView === "undefined" || !TradingView.widget) {
    document.getElementById("fail").style.display = "grid";
  }

  // The handshake. The app sends nothing - not even the init that builds the chart - until the page has said
  // `ready`, so it is said here, as soon as this script has run, exactly as chart.html says it. Waiting for
  // the library to finish first would mean each side waiting on the other, forever, over a blank pane.
  post({ type: "ready" });
})();
</script>
</body>
</html>
