<!doctype html>
<!--
  Ezymex Trader chart page for the app's WebView (Android). The same engine as the web terminal: TradingView
  Lightweight Charts 5.2.1, bundled OFFLINE next to this file (lightweight-charts.standalone.production.js, Apache 2.0,
  LICENSE-lightweight-charts.txt), and the web terminal's own indicators (indicators.bundle.js, generated from
  apps/terminal by tool/build_chart_indicators.mjs: the same maths, overlays, sub-windows and levels as the web).
  The app owns the data and sends it as JSON to window.K.recv(msg) or, coalesced, window.K.batch("[msg, …]"); this page
  draws it and posts gestures back on the `EzymexChart` channel (lib/features/terminal/chart/chart_bridge.dart):
    in:  init {digits, intraday, palette, symbol, tf, step, chartType, indicators, texts} · bars {bars}
         · older {bars, exhausted} · bar {bar} · quote {bid, ask} · lines {lines: [{id, kind, price, label, side, drag,
         note, tone, close, addSl, addTp, stops}]} · palette {palette} · indicators {indicators} · chartType {chartType}
    out: ready · dragstart {id} · drag {id, price} · dragend {id} · stop {id, which, price} · tap {id} · close {id}
         · older {before} · long {price} · ind {uid}
  Bars are [time (server-time seconds), open, high, low, close, volume]. Like the web chart (components/chart/
  engine.ts + chart-view.tsx): candles / bars / line / area (rising blue, falling red), the OHLC legend with one row per
  indicator (tap: show / hide, settings, remove), oscillators in their own sub-windows, the account's bid / ask lines,
  trade-line chips at the price scale (drag to move, × to close / remove, the P&L on them, S / T to set a stop), and
  the small Ezymex K in the plot's corner.
  Stops (MT5, TradingView): a position or order line does not move; `addSl` / `addTp` put the S / T handles on its chip.
  Dragged off the line, a handle draws a ghost stop line with its price and the money there; released, it posts
  stop {id, which: "sl" | "tp", price}. A line's `stops` {open, k, c, inv, order, gap} (chart_bridge.dart ChartStops)
  values and checks a stop here, without the app: money(p) = (p − open) × k ÷ (inv ? p : 1) + c, and a stop must stay
  beyond the reference by `gap`: below it for the SL of a buy / the TP of a sell, above it otherwise; the reference is
  the live bid (buy) / ask (sell), or the order's entry when `order`. On the wrong side the ghost (or a dragged SL / TP
  line) turns grey and says why; released there, nothing is sent (a dragged SL / TP line goes back and posts dragend,
  which only ends the app's hold of its line updates).
  A dragged chip follows the finger at frame rate: moves are applied once per animation frame, and trade-line updates
  from the app wait until the finger lifts.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      @font-face {
        font-family: "GeistMono";
        src: url("../fonts/GeistMono-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg, #0a0a0d);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #c {
        position: absolute;
        inset: 0;
      }
      #chips {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }
      .legend {
        position: absolute;
        left: 8px;
        z-index: 5;
        pointer-events: none;
        font: 500 11px "GeistMono", ui-monospace, monospace;
        line-height: 16px;
        color: var(--fg3, #8b8b96);
        max-width: calc(100% - 84px);
      }
      #legend {
        top: 6px;
      }
      .legend b {
        font-weight: 600;
        color: var(--fg, #f5f5f7);
        margin-right: 6px;
      }
      .legend .v {
        margin-right: 6px;
      }
      .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        white-space: nowrap;
        overflow: hidden;
        pointer-events: auto;
        font-size: 10.5px;
      }
      .lr .ll {
        color: var(--fg2, #a1a1aa);
      }
      .lr.off .ll {
        color: var(--fg3, #8b8b96);
        text-decoration: line-through;
      }
      .lmore {
        pointer-events: auto;
        font-size: 10.5px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        color: var(--fg3, #8b8b96);
      }
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        height: 20px;
        display: flex;
        align-items: center;
        border-radius: 5px;
        border: 1px solid transparent;
        font: 500 10.5px "GeistMono", ui-monospace, monospace;
        line-height: 1;
        white-space: nowrap;
        pointer-events: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        will-change: transform;
      }
      .chip > span {
        padding: 0 5px;
        height: 100%;
        display: flex;
        align-items: center;
      }
      .chip .grip {
        opacity: 0.7;
        font-size: 9px;
        letter-spacing: -1px;
        padding: 0 1px 0 4px;
      }
      .chip .note {
        border-left: 1px solid rgba(127, 127, 127, 0.35);
      }
      .chip .x {
        border-left: 1px solid rgba(127, 127, 127, 0.35);
        padding: 0 6px;
        font-size: 12px;
      }
      /* the S / T handles: drag off the line to set a stop loss / take profit */
      .chip .st {
        padding: 0 7px;
        font-weight: 600;
        color: #fff;
        border-left: 1px solid rgba(127, 127, 127, 0.35);
      }
      .chip .st.on {
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.6);
      }
      .chip.dragging {
        z-index: 2;
        box-shadow: 0 0 0 2px rgba(255, 90, 31, 0.45), 0 4px 14px rgba(0, 0, 0, 0.4);
      }
      #ghost {
        position: absolute;
        left: 0;
        top: 0;
        border-top: 1px dashed rgba(160, 160, 170, 0.7);
        pointer-events: none;
        z-index: 3;
        display: none;
        will-change: transform;
      }
      /* the ghost stop's price and money, or why it may not go there */
      #glabel {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 6;
        display: none;
        pointer-events: none;
        padding: 3px 6px;
        border-radius: 5px;
        color: #fff;
        font: 500 10.5px "GeistMono", ui-monospace, monospace;
        line-height: 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        will-change: transform;
      }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
    <script src="indicators.bundle.js"></script>
  </head>
  <body>
    <div id="c"></div>
    <div id="legend" class="legend"><div id="ohlc"></div><div id="lrows"></div></div>
    <div id="plegs"></div>
    <div id="ghost"></div>
    <div id="chips"></div>
    <div id="glabel"></div>
    <script>
      (function () {
        "use strict";
        const LC = window.LightweightCharts;
        const KI = window.EzymexInd;
        const host = document.getElementById("c");
        const chipsEl = document.getElementById("chips");
        const ghost = document.getElementById("ghost");
        const glabel = document.getElementById("glabel");
        const ohlcEl = document.getElementById("ohlc");
        const rowsEl = document.getElementById("lrows");
        const plegsEl = document.getElementById("plegs");
        const post = (m) => {
          try {
            window.EzymexChart.postMessage(JSON.stringify(m));
          } catch (e) {
            /* no channel (opened in a browser) */
          }
        };

        // Ezymex mark (assets/brand/ezymex-mark.svg), viewBox 652 x 460
        const MARK_D =
          "M 39.497 56.42 L 125.414 5.126 C 130.156 2.295 134 4.477 134 10 L 134 370 C 134 375.523 130.156 382.295 125.414 385.126 L 5.152 456.924 C 2.306 458.623 0 457.314 0 454 L 0 126 C 0 100.594 17.683 69.443 39.497 56.42 Z M 192 0 L 649 0 C 651.209 0 651.57 1.078 649.805 2.407 L 526.685 95.185 C 523.156 97.845 516.714 100 512.296 100 L 168 100 C 162.477 100 158 95.523 158 90 L 158 34 C 158 15.222 173.222 0 192 0 Z M 168 180 L 556 180 C 558.209 180 558.57 181.078 556.805 182.407 L 433.685 275.185 C 430.156 277.845 423.714 280 419.296 280 L 168 280 C 162.477 280 158 275.523 158 270 L 158 190 C 158 184.477 162.477 180 168 180 Z M 168 360 L 512.296 360 C 516.714 360 523.156 362.155 526.685 364.815 L 649.805 457.593 C 651.57 458.922 651.209 460 649 460 L 192 460 C 173.222 460 158 444.778 158 426 L 158 370 C 158 364.477 162.477 360 168 360 Z";
        let markPath = null;
        class Watermark {
          constructor() {
            this.dark = true;
            this.request = null;
            const self = this;
            this.views = [
              {
                zOrder: () => "bottom",
                renderer: () => ({
                  draw() {},
                  drawBackground(target) {
                    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
                      const w = mediaSize.width,
                        h = mediaSize.height;
                      if (w < 120 || h < 80) return;
                      const mh = h < 220 ? 14 : 18,
                        mw = (mh * 652) / 460,
                        pad = 10;
                      markPath = markPath || new Path2D(MARK_D);
                      ctx.save();
                      ctx.translate(pad, h - pad - mh);
                      ctx.scale(mw / 652, mh / 460);
                      ctx.fillStyle = self.dark ? "rgba(255,255,255,0.28)" : "rgba(15,15,20,0.26)";
                      ctx.fill(markPath, "evenodd");
                      ctx.restore();
                    });
                  },
                }),
              },
            ];
          }
          attached(p) {
            this.request = p.requestUpdate;
          }
          detached() {
            this.request = null;
          }
          paneViews() {
            return this.views;
          }
          setDark(d) {
            this.dark = d;
            if (this.request) this.request();
          }
        }

        let chart = null,
          main = null,
          vol = null,
          bidLine = null,
          askLine = null,
          wm = null,
          layer = null;
        let initMsg = null,
          pal = null,
          digits = 2,
          symbol = "",
          tf = "",
          step = 60,
          ctype = "candles",
          texts = {},
          data = [],
          loadingOlder = false,
          exhausted = false,
          hover = -1,
          bid = 0,
          ask = 0,
          alive = { v: true };
        let lines = [];
        let pendingLines = null;
        let inds = [];
        let legendOpen = false;
        const priceLines = new Map();
        const chips = new Map();
        let drag = null;

        const fmt = (p) => Number(p).toFixed(digits);
        const pow = () => Math.pow(10, digits);
        const toBar = (b) => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4], volume: b[5] || 0 });
        // rising blue, falling red (web --t-buy); P&L figures stay up / down
        const volColor = (d) => (d.close >= d.open ? pal.buy + "38" : pal.down + "38");
        const volPoint = (d) => ({ time: d.time, value: d.volume, color: volColor(d) });
        const mainPoint = (d) => (ctype === "line" || ctype === "area" ? { time: d.time, value: d.close } : { time: d.time, open: d.open, high: d.high, low: d.low, close: d.close });
        const onWarm = () => (pal.dark ? "#1a1204" : "#ffffff");
        const sepColor = () => (pal.dark ? "rgba(255,255,255,0.07)" : "rgba(15,15,20,0.1)");
        const pane0H = () => {
          try {
            return chart.panes()[0].getHeight();
          } catch (e) {
            return host.clientHeight - 30;
          }
        };

        /* ---------------- frame scheduling ---------------- */

        let rafId = 0,
          wantPlace = false,
          wantLegend = false;
        function frame() {
          rafId = 0;
          if (wantPlace) {
            wantPlace = false;
            placeChips();
          }
          if (wantLegend) {
            wantLegend = false;
            legend();
          }
        }
        const schedule = () => {
          if (!rafId) rafId = requestAnimationFrame(frame);
        };
        const schedulePlace = () => {
          wantPlace = true;
          schedule();
        };
        const scheduleLegend = () => {
          wantLegend = true;
          schedule();
        };

        /* ---------------- legend ---------------- */

        let legendSig = "";
        let rowEls = new Map();
        function legend() {
          if (!chart || !data.length) {
            ohlcEl.innerHTML = "";
            rowsEl.innerHTML = "";
            plegsEl.innerHTML = "";
            legendSig = "";
            return;
          }
          const i = hover >= 0 && hover < data.length ? hover : data.length - 1;
          const b = data[i];
          const col = b.close >= b.open ? pal.buy : pal.down;
          const v = (k, x) => `<span class="v">${k} <span style="color:${col}">${fmt(x)}</span></span>`;
          ohlcEl.innerHTML = `<b>${symbol}, ${tf}</b>${v("O", b.open)}${v("H", b.high)}${v("L", b.low)}${v("C", b.close)}`;
          const rows = layer ? layer.legend(i) : [];
          // main-pane rows (overlays and hidden instances) fold into "+N more" when they would cover the pane
          const mainRows = rows.filter((r) => r.pane <= 0);
          const subRows = rows.filter((r) => r.pane > 0);
          const maxRows = Math.max(1, Math.floor((pane0H() - 70) / 18));
          const folded = !legendOpen && mainRows.length > maxRows;
          const shownMain = folded ? mainRows.slice(0, maxRows - 1) : mainRows;
          let tops = [0];
          if (subRows.length) {
            const top0 = host.getBoundingClientRect().top;
            tops = chart.panes().map((p) => {
              const el = p.getHTMLElement && p.getHTMLElement();
              return el ? Math.round(el.getBoundingClientRect().top - top0) : 0;
            });
          }
          const sig = JSON.stringify([shownMain.map((r) => [r.uid, r.label, r.visible]), subRows.map((r) => [r.uid, r.label, r.pane, tops[r.pane]]), folded, legendOpen, mainRows.length]);
          if (sig !== legendSig) {
            legendSig = sig;
            rowEls = new Map();
            rowsEl.innerHTML = "";
            plegsEl.innerHTML = "";
            const make = (r) => {
              const el = document.createElement("div");
              el.className = "lr" + (r.visible ? "" : " off");
              el.dataset.uid = r.uid;
              const l = document.createElement("span");
              l.className = "ll";
              l.textContent = r.label;
              const vals = document.createElement("span");
              vals.className = "lvs";
              el.append(l, vals);
              el.addEventListener("pointerdown", (e) => e.stopPropagation());
              el.addEventListener("click", (e) => {
                e.stopPropagation();
                post({ type: "ind", uid: r.uid });
              });
              rowEls.set(r.uid, vals);
              return el;
            };
            for (const r of shownMain) rowsEl.appendChild(make(r));
            if (mainRows.length > maxRows || legendOpen) {
              if (mainRows.length > maxRows) {
                const m = document.createElement("div");
                m.className = "lmore";
                m.textContent = legendOpen ? texts.less || "Show less" : (texts.more || "+{count} more").replace("{count}", String(mainRows.length - shownMain.length));
                m.addEventListener("pointerdown", (e) => e.stopPropagation());
                m.addEventListener("click", (e) => {
                  e.stopPropagation();
                  legendOpen = !legendOpen;
                  legend();
                });
                rowsEl.appendChild(m);
              }
            }
            for (const r of subRows) {
              if (tops[r.pane] === undefined) continue;
              const box = document.createElement("div");
              box.className = "legend";
              box.style.top = tops[r.pane] + 3 + "px";
              box.appendChild(make(r));
              plegsEl.appendChild(box);
            }
          }
          for (const r of rows) {
            const el = rowEls.get(r.uid);
            if (!el) continue;
            let html = "";
            for (const x of r.values) html += `<span style="color:${x.color}">${x.text}</span> `;
            if (el._h !== html) {
              el._h = html;
              el.innerHTML = html;
            }
          }
        }

        /* ---------------- chart ---------------- */

        function addMain() {
          const pf = { type: "price", precision: digits, minMove: 1 / pow() };
          if (ctype === "bars") main = chart.addSeries(LC.BarSeries, { upColor: pal.buy, downColor: pal.down, thinBars: false, priceFormat: pf });
          else if (ctype === "line") main = chart.addSeries(LC.LineSeries, { color: pal.gold, lineWidth: 2, priceFormat: pf, crosshairMarkerVisible: false });
          else if (ctype === "area") main = chart.addSeries(LC.AreaSeries, { lineColor: pal.gold, topColor: "rgba(233,185,73,0.28)", bottomColor: "rgba(233,185,73,0.0)", lineWidth: 2, priceFormat: pf, crosshairMarkerVisible: false });
          else main = chart.addSeries(LC.CandlestickSeries, { upColor: pal.buy, downColor: pal.down, borderVisible: false, wickUpColor: pal.buy, wickDownColor: pal.down, priceFormat: pf });
          main.applyOptions({ priceLineVisible: false, lastValueVisible: false, title: "" });
        }

        function setVars() {
          const s = document.documentElement.style;
          s.setProperty("--bg", pal.bg);
          s.setProperty("--fg", pal.fg);
          s.setProperty("--fg2", pal.fg2);
          s.setProperty("--fg3", pal.fg3);
          // the indicator layer reads the "info" colour token from this variable (layer.ts tokenMap)
          if (pal.info) s.setProperty("--k-info", pal.info);
        }

        function build(msg) {
          if (chart) {
            alive.v = false;
            chart.remove();
          }
          alive = { v: true };
          const a = alive;
          initMsg = msg;
          priceLines.clear();
          chips.clear();
          chipsEl.innerHTML = "";
          drag = null;
          pendingLines = null;
          legendSig = "";
          digits = msg.digits;
          pal = msg.palette;
          symbol = msg.symbol || "";
          tf = msg.tf || "";
          step = msg.step || 60;
          ctype = msg.chartType || "candles";
          texts = msg.texts || {};
          hover = -1;
          setVars();
          chart = LC.createChart(host, {
            autoSize: true,
            layout: {
              background: { type: "solid", color: pal.bg },
              textColor: pal.fg3,
              fontFamily: "GeistMono, ui-monospace, monospace",
              fontSize: 10.5,
              attributionLogo: false,
              panes: { separatorColor: sepColor(), separatorHoverColor: "rgba(255,90,31,0.35)", enableResize: true },
            },
            grid: { vertLines: { color: pal.grid }, horzLines: { color: pal.grid } },
            rightPriceScale: { borderVisible: true, borderColor: pal.line, scaleMargins: { top: 0.12, bottom: 0.14 }, minimumWidth: 60 },
            timeScale: { borderVisible: true, borderColor: pal.line, timeVisible: msg.intraday, secondsVisible: false, rightOffset: 8, barSpacing: 7, minBarSpacing: 1.5 },
            crosshair: {
              mode: 0,
              vertLine: { color: pal.fg3, width: 1, style: 2, labelBackgroundColor: pal.label },
              horzLine: { color: pal.fg3, width: 1, style: 2, labelBackgroundColor: pal.label },
            },
            localization: { priceFormatter: fmt },
            handleScale: { axisPressedMouseMove: true, pinch: true, mouseWheel: true },
            handleScroll: { horzTouchDrag: true, vertTouchDrag: false, pressedMouseMove: true },
            kineticScroll: { touch: true },
          });
          addMain();
          vol = chart.addSeries(LC.HistogramSeries, { priceScaleId: "vol", priceLineVisible: false, lastValueVisible: false, priceFormat: { type: "volume" } });
          chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.86, bottom: 0 } });
          // Squeeze / spread the prices by dragging the price axis with a finger (MT5): lightweight-charts only scales
          // the axis on a vertical touch drag while handleScroll.vertTouchDrag is on (its PriceAxisWidget treats the
          // drag as page scroll otherwise), and that option would also let a vertical drag on the plot pan the prices.
          // So it is on only from a touch that starts on an axis until the finger lifts. A double tap resets the scale.
          if (!host.dataset.axisTouch) {
            host.dataset.axisTouch = "1";
            host.addEventListener(
              "touchstart",
              (e) => {
                const t = e.touches[0];
                if (!t || !chart || e.touches.length !== 1) return;
                if (t.clientX - host.getBoundingClientRect().left >= chart.timeScale().width()) {
                  chart.applyOptions({ handleScroll: { vertTouchDrag: true } });
                }
              },
              { capture: true, passive: true },
            );
            const axisTouchEnd = () => {
              if (chart && !drag) chart.applyOptions({ handleScroll: { vertTouchDrag: false } });
            };
            window.addEventListener("touchend", axisTouchEnd, { capture: true, passive: true });
            window.addEventListener("touchcancel", axisTouchEnd, { capture: true, passive: true });
          }
          wm = new Watermark();
          wm.setDark(pal.dark);
          chart.panes()[0].attachPrimitive(wm);
          bidLine = main.createPriceLine({ price: 0, color: pal.fg2, lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "", axisLabelColor: pal.fg2, axisLabelTextColor: pal.dark ? "#0a0a0d" : "#fff" });
          askLine = main.createPriceLine({ price: 0, color: pal.down, lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "", axisLabelColor: pal.down, axisLabelTextColor: "#fff" });
          bid = 0;
          ask = 0;
          data = [];
          layer = KI
            ? KI.createIndicatorLayer({ chart, bars: () => data, step, digits, palette: pal, alive: () => a.v, onChange: scheduleLegend })
            : null;
          // validated against the registry like the web workspace (unknown types dropped, params repaired)
          inds = KI ? KI.migrateIndicators(msg.indicators || []) : [];
          if (layer) layer.sync(inds);
          chart.timeScale().subscribeVisibleLogicalRangeChange((r) => {
            schedulePlace();
            if (!r || exhausted || loadingOlder || !data.length || r.from > 30) return;
            loadingOlder = true;
            post({ type: "older", before: data[0].time });
          });
          chart.subscribeCrosshairMove((p) => {
            hover = !p || p.logical === undefined || p.logical === null || !p.time ? -1 : Math.max(0, Math.min(data.length - 1, Math.round(p.logical)));
            scheduleLegend();
          });
          lines = [];
          renderLines();
          legend();
        }

        function drawAll() {
          main.setData(data.map(mainPoint));
          vol.setData(data.map(volPoint));
          if (layer) layer.reset();
        }

        function setBars(bars) {
          data = bars.map(toBar);
          exhausted = false;
          loadingOlder = false;
          drawAll();
          scheduleLegend();
          chart.timeScale().scrollToRealTime();
          requestAnimationFrame(() => {
            if (!chart) return;
            chart.timeScale().applyOptions({ barSpacing: 7, rightOffset: 8 });
            chart.timeScale().scrollToRealTime();
            schedulePlace();
          });
        }

        function prepend(bars, done) {
          loadingOlder = false;
          exhausted = !!done;
          if (!bars.length || !data.length) return;
          const first = data[0].time;
          const add = bars.filter((b) => b[0] < first).map(toBar);
          if (!add.length) {
            exhausted = true;
            return;
          }
          data = add.concat(data);
          drawAll();
          schedulePlace();
          scheduleLegend();
        }

        function upsertBar(raw) {
          if (!data.length) return;
          const b = toBar(raw);
          const last = data[data.length - 1];
          if (b.time < last.time) return;
          if (b.time > last.time) data.push(b);
          else data[data.length - 1] = b;
          main.update(mainPoint(b));
          vol.update(volPoint(b));
          if (layer) layer.update();
          if (hover < 0) scheduleLegend();
          schedulePlace();
        }

        function setQuote(b, a) {
          if (!bidLine) return;
          if (b !== bid) bidLine.applyOptions({ price: b });
          if (a !== ask) askLine.applyOptions({ price: a });
          bid = b;
          ask = a;
          // a dragged stop is checked against the live price: the finger may rest while the price crosses it
          if (drag && drag.repaint) drag.repaint();
        }

        function setIndicators(list) {
          inds = KI ? KI.migrateIndicators(list || []) : [];
          legendSig = "";
          if (layer) layer.sync(inds);
          scheduleLegend();
        }

        /** Chart type: a fresh chart (like the web), keeping the data, the lines and the view. */
        function setChartType(t) {
          if (!initMsg || t === ctype) return;
          const saved = data,
            savedLines = lines,
            b = bid,
            a = ask,
            range = chart.timeScale().getVisibleLogicalRange(),
            ex = exhausted;
          build(Object.assign({}, initMsg, { chartType: t, indicators: inds, palette: pal }));
          data = saved;
          exhausted = ex;
          drawAll();
          if (range) chart.timeScale().setVisibleLogicalRange(range);
          setQuote(b, a);
          lines = savedLines;
          renderLines();
          legend();
        }

        /* ---------------- trade lines ---------------- */

        // buy positions blue, sell red; SL red, TP green, orders gold
        const colorOf = (l) =>
          l.kind === "sl" ? pal.down : l.kind === "tp" ? pal.up : l.kind === "pending" ? pal.gold : l.kind === "alert" || l.kind === "barrier" ? pal.warn : l.kind === "strike" ? pal.ember : l.kind === "breakeven" ? pal.fg2 : l.side === "buy" ? pal.buy : pal.down;
        // 0 solid · 1 dotted · 2 dashed · 4 sparse dotted (lightweight-charts LineStyle)
        const styleOf = (l) => (l.kind === "pos" ? 0 : l.kind === "alert" ? 4 : l.kind === "breakeven" ? 1 : 2);

        function chipColors(l) {
          if (l.kind === "sl") return [pal.down, "#fff", pal.down];
          if (l.kind === "tp") return [pal.up, "#fff", pal.up];
          if (l.kind === "pending") return [pal.gold, onWarm(), pal.gold];
          if (l.kind === "alert" || l.kind === "barrier") return [pal.warn, onWarm(), pal.warn];
          if (l.kind === "strike") return [pal.ember, "#fff", pal.ember];
          if (l.kind === "breakeven") return [pal.panel, pal.fg2, pal.fg3];
          const c = l.side === "buy" ? pal.buy : pal.down;
          return [pal.panel, c, c];
        }

        /** The line of a moved chip drag (a moved line); not an S / T drag, which leaves its line where it is. */
        const dragOf = (id) => !!(drag && drag.id === id && drag.moved && !drag.stop);

        /* ---------------- stops: money and side (chart_bridge.dart ChartStops) ---------------- */

        /** Account money like the app's accMoney: "+1,234.50", "-12.00", "0.00". */
        function fmtMoney(v) {
          const a = Math.abs(v).toFixed(2);
          const zero = Number(a) === 0;
          const dot = a.indexOf(".");
          return (v < 0 && !zero ? "-" : v > 0 && !zero ? "+" : "") + a.slice(0, dot).replace(/\B(?=(\d{3})+$)/g, ",") + a.slice(dot);
        }
        const stopMoney = (s, p) => ((p - s.open) * s.k) / (s.inv && p > 0 ? p : 1) + (s.c || 0);

        /** Null when a stop `which` (sl | tp) of line l may go to `price`, else [text key, limit] (engine check_sltp). */
        function stopProblem(l, which, price) {
          const s = l.stops;
          if (!s) return null;
          const buy = l.side === "buy";
          const r = s.order ? s.open : buy ? bid : ask;
          if (!(r > 0)) return null; // no quote yet: the server decides
          const gap = s.gap || 0;
          const below = (which === "sl") === buy;
          const limit = below ? r - gap : r + gap;
          const eps = 1e-9 * Math.max(1, r);
          const bad = price <= 0 || (below ? price > limit + eps || price >= r - eps : price < limit - eps || price <= r + eps);
          return bad ? [which + (below ? "Below" : "Above"), limit] : null;
        }
        const badText = (b) => (texts[b[0]] || b[0]).replace("{price}", fmt(b[1]));
        const notSent = () => texts.notSent || "Nothing was sent to the server.";

        /** The ghost stop: a dashed line at y (optional) and its label at the left (tone sl | tp | bad: grey). */
        let ghostTimer = 0;
        function showGhost(y, tone, text, withLine) {
          clearTimeout(ghostTimer);
          const w = chart.timeScale().width();
          const col = tone === "bad" ? pal.fg3 : tone === "sl" ? pal.down : pal.up;
          const yy = Math.round(y);
          ghost.style.display = withLine ? "block" : "none";
          if (withLine) {
            ghost.style.width = w + "px";
            ghost.style.borderTopColor = col;
            ghost.style.transform = `translateY(${yy}px)`;
          }
          glabel.style.display = "block";
          glabel.style.maxWidth = Math.max(80, w - 16) + "px";
          glabel.style.background = tone === "bad" ? pal.label : col;
          if (glabel.textContent !== text) glabel.textContent = text;
          // above the line, or below it near the top
          glabel.style.transform = yy > 40 ? `translate(8px, calc(${yy - 4}px - 100%))` : `translate(8px, ${yy + 4}px)`;
        }
        function hideGhost(after) {
          clearTimeout(ghostTimer);
          const go = () => {
            ghost.style.display = "none";
            glabel.style.display = "none";
          };
          if (after) ghostTimer = setTimeout(go, after);
          else go();
        }

        const setText = (el, s) => {
          if (el.textContent !== s) el.textContent = s;
        };

        function fillChip(c, l) {
          const dragging = dragOf(l.id);
          // a SL / TP dragged to the wrong side of the price turns grey
          const [bg, fg, border] = dragging && drag.bad ? [pal.label, "#fff", pal.fg3] : chipColors(l);
          const filled = l.kind !== "pos" && l.kind !== "breakeven";
          const noteColor = filled ? fg : l.tone === "up" ? pal.up : l.tone === "down" ? pal.down : pal.fg2;
          // a dragged stop shows the money at the finger
          const note = dragging && l.stops && (l.kind === "sl" || l.kind === "tp") ? fmtMoney(stopMoney(l.stops, drag.price)) : l.note || "";
          const sig = [bg, fg, border, l.drag, !!note, noteColor, l.close, !!l.addSl, !!l.addTp].join("|");
          if (c.sig !== sig) {
            c.sig = sig;
            const el = c.el;
            el.style.background = bg;
            el.style.color = fg;
            el.style.borderColor = border;
            el.title = l.kind === "pos" && (l.addSl || l.addTp) ? texts.posTip || "" : "";
            c.grip.style.display = l.drag ? "flex" : "none";
            c.note.style.display = note ? "flex" : "none";
            c.note.style.color = noteColor;
            c.sb.style.display = l.addSl ? "flex" : "none";
            c.sb.style.background = pal.down;
            c.tb.style.display = l.addTp ? "flex" : "none";
            c.tb.style.background = pal.up;
            c.x.style.display = l.close ? "flex" : "none";
            c.w = -1;
          }
          if (c.note.textContent !== note) {
            if (c.note.textContent.length !== note.length) c.w = -1;
            c.note.textContent = note;
          }
          setLabel(c, dragging && l.kind !== "pos" ? l.label + " " + fmt(drag.price) : l.label);
        }

        /** The chip font is monospaced: the width changes only with the text length. */
        function setLabel(c, s) {
          if (c.lbl.textContent === s) return;
          if (c.lbl.textContent.length !== s.length) c.w = -1;
          c.lbl.textContent = s;
        }

        function lineOpts(l, price) {
          const col = colorOf(l);
          return { price, color: col, lineWidth: 1, lineStyle: styleOf(l), axisLabelVisible: true, title: "", axisLabelColor: col, axisLabelTextColor: l.kind === "pending" || l.kind === "alert" || l.kind === "barrier" ? onWarm() : "#fff" };
        }

        function renderLines() {
          if (!main) return;
          const want = new Set(lines.map((l) => l.id));
          for (const [id, pl] of priceLines) {
            if (!want.has(id)) {
              main.removePriceLine(pl.line);
              priceLines.delete(id);
            }
          }
          for (const [id, c] of chips) {
            if (!want.has(id) && !(drag && drag.id === id)) {
              c.el.remove();
              chips.delete(id);
            }
          }
          for (const l of lines) {
            const price = dragOf(l.id) ? drag.price : l.price;
            const opts = lineOpts(l, price);
            const key = JSON.stringify(opts);
            const pl = priceLines.get(l.id);
            if (!pl) priceLines.set(l.id, { line: main.createPriceLine(opts), key });
            else if (pl.key !== key) {
              pl.line.applyOptions(opts);
              pl.key = key;
            }
            let c = chips.get(l.id);
            if (!c) {
              const el = document.createElement("div");
              el.className = "chip";
              el.dataset.id = l.id;
              const grip = document.createElement("span");
              grip.className = "grip";
              grip.textContent = "⋮⋮";
              const lbl = document.createElement("span");
              lbl.className = "lbl";
              const note = document.createElement("span");
              note.className = "note";
              const sb = document.createElement("span");
              sb.className = "st";
              sb.textContent = "S";
              sb.title = texts.dragSl || "";
              const tb = document.createElement("span");
              tb.className = "st";
              tb.textContent = "T";
              tb.title = texts.dragTp || "";
              const x = document.createElement("span");
              x.className = "x";
              x.textContent = "×";
              el.append(grip, lbl, note, sb, tb, x);
              c = { el, grip, lbl, note, sb, tb, x, l, sig: "", w: -1, tx: NaN, ty: NaN, shown: true };
              chips.set(l.id, c);
              const cc = c;
              // S / T: their own drag (a stop off the line), never the chip's
              sb.addEventListener("pointerdown", (e) => startStop(e, cc, "sl"));
              tb.addEventListener("pointerdown", (e) => startStop(e, cc, "tp"));
              x.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                e.stopPropagation();
              });
              x.addEventListener("click", (e) => {
                e.stopPropagation();
                post({ type: "close", id: cc.l.id });
              });
              el.addEventListener("pointerdown", (e) => startDrag(e, cc));
              chipsEl.appendChild(el);
            }
            c.l = l;
            fillChip(c, l);
          }
          placeChips();
        }

        const show = (c, on) => {
          if (c.shown === on) return;
          c.shown = on;
          c.el.style.display = on ? "flex" : "none";
        };
        const moveTo = (c, x, y) => {
          if (c.tx === x && c.ty === y) return;
          c.tx = x;
          c.ty = y;
          c.el.style.transform = `translate(${x}px, ${y - 11}px)`; // 22 px tall with its border: centred on the line
        };

        /** Chips sit at the price scale like the web's; chips of nearby prices line up side by side to the left. The
         *  dragged chip follows the finger on its own. Widths are measured once per text length (no layout per frame). */
        function placeChips() {
          if (!main || !chart) return;
          const plotW = chart.timeScale().width();
          // chips stay in the main window (a line at its very bottom keeps its chip); a chip is 22 px tall and
          // centred on its line, so the ones near the pane's bottom edge are held above the next window
          const maxY = pane0H() + 1;
          const clampY = (y) => Math.min(y, pane0H() - 11);
          const shown = [];
          let dragged = null;
          for (const c of chips.values()) {
            const l = c.l;
            const isDrag = dragOf(l.id);
            const y = main.priceToCoordinate(isDrag ? drag.price : l.price);
            if (y === null || y < 8 || y > maxY) {
              if (!isDrag) {
                show(c, false);
                continue;
              }
            }
            show(c, true);
            if (isDrag) dragged = { c, y: y === null ? drag.y : y };
            else shown.push({ c, y });
          }
          // reads first (widths of chips whose text changed), then writes
          for (const s of shown) if (s.c.w < 0) s.c.w = s.c.el.offsetWidth;
          if (dragged && dragged.c.w < 0) dragged.c.w = dragged.c.el.offsetWidth;
          shown.sort((a, b) => a.y - b.y);
          let rowY = -1000,
            right = plotW - 6;
          for (const s of shown) {
            if (s.y - rowY >= 21) {
              rowY = s.y;
              right = plotW - 6;
            }
            const left = Math.max(4, right - s.c.w);
            moveTo(s.c, Math.round(left), Math.round(clampY(s.y)));
            right = left - 4;
          }
          if (dragged) moveTo(dragged.c, Math.round(Math.max(4, plotW - 6 - dragged.c.w)), Math.round(clampY(dragged.y)));
        }

        function startDrag(e, c) {
          e.preventDefault();
          e.stopPropagation();
          const l = c.l;
          const el = c.el;
          const startY = e.clientY;
          const top = host.getBoundingClientRect().top;
          const maxY = pane0H() - 2;
          // a SL / TP line is checked against the price while it moves (stops); orders and alerts go anywhere
          const stopKind = (l.kind === "sl" || l.kind === "tp") && l.stops ? l.kind : null;
          drag = { id: l.id, price: l.price, moved: false, y: startY - top, raf: 0, bad: null };
          const d0 = drag;
          if (l.drag) chart.applyOptions({ handleScroll: false, handleScale: false });
          el.classList.add("dragging");
          try {
            el.setPointerCapture(e.pointerId);
          } catch (x) {}
          // one frame: the chip and its label follow the latest finger position; a stop on the wrong side turns grey
          const paint = () => {
            d0.raf = 0;
            if (drag !== d0) return;
            if (stopKind && d0.moved) {
              const was = !!d0.bad;
              d0.bad = stopProblem(c.l, stopKind, d0.price);
              const pl = priceLines.get(l.id);
              if (pl && was !== !!d0.bad) {
                const col = d0.bad ? pal.fg3 : colorOf(l);
                pl.line.applyOptions({ color: col, axisLabelColor: col });
                pl.key = "";
              }
              if (d0.bad) showGhost(d0.y, "bad", badText(d0.bad), false);
              else if (was) hideGhost();
            }
            fillChip(c, c.l);
            placeChips();
          };
          if (stopKind) d0.repaint = () => d0.moved && !d0.raf && (d0.raf = requestAnimationFrame(paint));
          const move = (ev) => {
            if (!l.drag || drag !== d0) return;
            if (!d0.moved) {
              if (Math.abs(ev.clientY - startY) <= 4) return;
              d0.moved = true;
              post({ type: "dragstart", id: l.id });
            }
            const y = Math.max(2, Math.min(maxY, ev.clientY - top));
            const p = main.coordinateToPrice(y);
            if (p === null) return;
            const price = Math.round(p * pow()) / pow();
            d0.y = y;
            if (price === d0.price && d0.raf) return;
            d0.price = price;
            // the price line moves with the chart's own frame; the chip with ours
            const pl = priceLines.get(l.id);
            if (pl) {
              pl.line.applyOptions({ price });
              pl.key = "";
            }
            if (!d0.raf) d0.raf = requestAnimationFrame(paint);
          };
          const up = () => {
            el.removeEventListener("pointermove", move);
            el.removeEventListener("pointerup", up);
            el.removeEventListener("pointercancel", up);
            el.removeEventListener("lostpointercapture", up);
            if (d0.raf) cancelAnimationFrame(d0.raf);
            el.classList.remove("dragging");
            chart.applyOptions({ handleScroll: { horzTouchDrag: true, vertTouchDrag: false, pressedMouseMove: true }, handleScale: { axisPressedMouseMove: true, pinch: true, mouseWheel: true } });
            if (drag !== d0) return;
            drag = null;
            if (d0.moved && l.drag) {
              // checked again at the drop: the price may have moved since the last frame
              const bad = stopKind ? stopProblem(c.l, stopKind, d0.price) : null;
              if (bad) {
                // the wrong side of the price: back where it was and nothing sent (dragend only ends the app's hold)
                showGhost(d0.y, "bad", badText(bad) + " · " + notSent(), false);
                hideGhost(2400);
                post({ type: "dragend", id: l.id });
              } else {
                if (stopKind) hideGhost();
                // a stop, order or alert stays at the drop price until the app answers with its lines
                c.l = Object.assign({}, c.l, { price: d0.price });
                lines = lines.map((x) => (x.id === l.id ? c.l : x));
                post({ type: "drag", id: l.id, price: d0.price });
              }
            } else if (!d0.moved) post({ type: "tap", id: l.id });
            if (pendingLines) {
              lines = pendingLines;
              pendingLines = null;
            }
            renderLines();
          };
          el.addEventListener("pointermove", move);
          el.addEventListener("pointerup", up);
          el.addEventListener("pointercancel", up);
          // a lost capture (the system took the touch) ends the drag too: never a stuck chip
          el.addEventListener("lostpointercapture", up);
        }

        /** The S / T handle of a position or order chip: a ghost stop line follows the finger from the trade's line
         *  with its price and the money there (grey with the reason on the wrong side of the price); released, it
         *  posts stop {id, which, price}, or nothing on the wrong side. The trade's line and chip stay put. */
        function startStop(e, c, which) {
          e.preventDefault();
          e.stopPropagation();
          const l = c.l;
          const el = which === "sl" ? c.sb : c.tb;
          const startY = e.clientY;
          const top = host.getBoundingClientRect().top;
          const maxY = pane0H() - 2;
          const y0 = main.priceToCoordinate(l.price);
          const hint = which === "sl" ? texts.dragSl || "Drag to set a stop loss" : texts.dragTp || "Drag to set a take profit";
          // lines from the app wait while a handle is held (recv): the chip and its handle stay under the finger
          drag = { id: l.id, stop: which, price: l.price, moved: false, y: y0 === null ? startY - top : y0, raf: 0, bad: null };
          const d0 = drag;
          chart.applyOptions({ handleScroll: false, handleScale: false });
          el.classList.add("on");
          try {
            el.setPointerCapture(e.pointerId);
          } catch (x) {}
          showGhost(d0.y, which, hint, true);
          const paint = () => {
            d0.raf = 0;
            if (drag !== d0) return;
            d0.bad = stopProblem(c.l, which, d0.price);
            const money = c.l.stops ? " · " + fmtMoney(stopMoney(c.l.stops, d0.price)) : "";
            showGhost(d0.y, d0.bad ? "bad" : which, d0.bad ? badText(d0.bad) : which.toUpperCase() + " " + fmt(d0.price) + money, true);
          };
          d0.repaint = () => d0.moved && !d0.raf && (d0.raf = requestAnimationFrame(paint));
          const move = (ev) => {
            if (drag !== d0) return;
            if (!d0.moved) {
              if (Math.abs(ev.clientY - startY) <= 4) return;
              d0.moved = true;
            }
            const y = Math.max(2, Math.min(maxY, ev.clientY - top));
            const p = main.coordinateToPrice(y);
            if (p === null) return;
            d0.y = y;
            d0.price = Math.round(p * pow()) / pow();
            if (!d0.raf) d0.raf = requestAnimationFrame(paint);
          };
          const up = () => {
            el.removeEventListener("pointermove", move);
            el.removeEventListener("pointerup", up);
            el.removeEventListener("pointercancel", up);
            el.removeEventListener("lostpointercapture", up);
            if (d0.raf) cancelAnimationFrame(d0.raf);
            el.classList.remove("on");
            chart.applyOptions({ handleScroll: { horzTouchDrag: true, vertTouchDrag: false, pressedMouseMove: true }, handleScale: { axisPressedMouseMove: true, pinch: true, mouseWheel: true } });
            if (drag !== d0) return;
            drag = null;
            if (!d0.moved) {
              // a tap on S / T: the hint stays a moment
              hideGhost(1600);
            } else {
              // checked again at the drop: the price may have moved since the last frame
              const bad = stopProblem(c.l, which, d0.price);
              if (bad) {
                showGhost(d0.y, "bad", badText(bad) + " · " + notSent(), true);
                hideGhost(2400);
              } else {
                hideGhost();
                post({ type: "stop", id: l.id, which, price: d0.price });
              }
            }
            if (pendingLines) {
              lines = pendingLines;
              pendingLines = null;
            }
            renderLines();
          };
          el.addEventListener("pointermove", move);
          el.addEventListener("pointerup", up);
          el.addEventListener("pointercancel", up);
          el.addEventListener("lostpointercapture", up);
        }

        /* ---------------- long press on the plot ---------------- */

        let lpTimer = null,
          lpX = 0,
          lpY = 0;
        host.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length !== 1 || drag) return;
            lpX = e.touches[0].clientX;
            lpY = e.touches[0].clientY;
            clearTimeout(lpTimer);
            lpTimer = setTimeout(() => {
              const rect = host.getBoundingClientRect();
              const y = lpY - rect.top;
              if (!main || y > pane0H()) return;
              const p = main.coordinateToPrice(y);
              if (p !== null) post({ type: "long", price: Math.round(p * pow()) / pow() });
            }, 600);
          },
          { passive: true },
        );
        const cancelLp = (e) => {
          if (e && e.touches && e.touches.length && Math.hypot(e.touches[0].clientX - lpX, e.touches[0].clientY - lpY) < 8) return;
          clearTimeout(lpTimer);
        };
        host.addEventListener("touchmove", cancelLp, { passive: true });
        host.addEventListener("touchend", () => clearTimeout(lpTimer), { passive: true });
        host.addEventListener("touchcancel", () => clearTimeout(lpTimer), { passive: true });

        function setPalette(p) {
          pal = p;
          setVars();
          if (!chart) return;
          chart.applyOptions({
            layout: { background: { type: "solid", color: pal.bg }, textColor: pal.fg3, panes: { separatorColor: sepColor() } },
            grid: { vertLines: { color: pal.grid }, horzLines: { color: pal.grid } },
            rightPriceScale: { borderColor: pal.line },
            timeScale: { borderColor: pal.line },
            crosshair: { vertLine: { color: pal.fg3, labelBackgroundColor: pal.label }, horzLine: { color: pal.fg3, labelBackgroundColor: pal.label } },
          });
          if (ctype === "candles") main.applyOptions({ upColor: pal.buy, downColor: pal.down, wickUpColor: pal.buy, wickDownColor: pal.down });
          else if (ctype === "bars") main.applyOptions({ upColor: pal.buy, downColor: pal.down });
          else if (ctype === "line") main.applyOptions({ color: pal.gold });
          else main.applyOptions({ lineColor: pal.gold });
          vol.setData(data.map(volPoint));
          if (layer) layer.setPalette(pal);
          bidLine.applyOptions({ color: pal.fg2, axisLabelColor: pal.fg2, axisLabelTextColor: pal.dark ? "#0a0a0d" : "#fff" });
          askLine.applyOptions({ color: pal.down, axisLabelColor: pal.down });
          wm.setDark(pal.dark);
          for (const c of chips.values()) c.sig = "";
          renderLines();
          legendSig = "";
          legend();
        }

        function recv(m) {
          switch (m.type) {
            case "init":
              return build(m);
            case "bars":
              return setBars(m.bars);
            case "older":
              return prepend(m.bars, m.exhausted);
            case "bar":
              return upsertBar(m.bar);
            case "quote":
              return setQuote(m.bid, m.ask);
            case "lines":
              // while a chip is dragged (or its S / T handle held) the app's lines wait: the dragged line stays under
              // the finger
              if (drag && (drag.moved || drag.stop)) {
                pendingLines = m.lines || [];
                return;
              }
              lines = m.lines || [];
              return renderLines();
            case "palette":
              return setPalette(m.palette);
            case "indicators":
              return setIndicators(m.indicators);
            case "chartType":
              return setChartType(m.chartType);
          }
        }

        window.K = {
          recv(msg) {
            recv(typeof msg === "string" ? JSON.parse(msg) : msg);
          },
          /** Several commands in one call (the app coalesces quotes, bars and lines to one call per frame). */
          batch(msgs) {
            const list = typeof msgs === "string" ? JSON.parse(msgs) : msgs;
            for (const m of list) recv(m);
          },
        };
        window.addEventListener("resize", () => {
          schedulePlace();
          legendSig = "";
          scheduleLegend();
        });
        setInterval(() => {
          if (!drag) schedulePlace();
        }, 400);
        post({ type: "ready" });
      })();
    </script>
  </body>
</html>
