# Lints for the Ezymex app: the Flutter recommended set plus a few that keep a large, multi-agent codebase consistent.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/**.g.dart
    - android/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # API JSON is dynamic by nature; parse it in the models, never in widgets
    avoid_dynamic_calls: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters

# `dart format .` uses this width (keep it: the codebase is formatted at 160)
formatter:
  page_width: 160
