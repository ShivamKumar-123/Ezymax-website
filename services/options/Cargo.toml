[package]
name = "options"
version = "0.1.0"
edition = "2024"
description = "Ezymex FX Options reference data and market side: underlyings, holidays, rates, vol surfaces, series, TWAP fixings, chain REST + WS, engine snapshot."

[lib]
path = "src/lib.rs"

[[bin]]
name = "options"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
optmath = { path = "../../crates/optmath" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "migrate", "json"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
