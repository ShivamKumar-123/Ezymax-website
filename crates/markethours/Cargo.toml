[package]
name = "markethours"
version = "0.1.0"
edition = "2024"
description = "Trading sessions shared by market-data, the trading engine and ALGO: broker server time (New York close), exchange hours with their daylight-saving rules, and holiday calendars (config/holidays)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
