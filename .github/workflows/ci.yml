name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Working tree only, not history: the job's purpose is to stop a NEW
      # credential from landing. Scanning history would fail every run on
      # whatever is already back there and teach everyone to ignore it.
      #
      # Pinned, and pinned to a version that honours top-level [[allowlists]].
      # 8.21.2 parses that block and then ignores it, so the config looks
      # applied and every allowlisted finding still fails the build.
      #
      # -v because a scanner that says "leaks found: 3" and not which three
      # cannot be acted on.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --no-git --redact --no-banner -v --config .gitleaks.toml

  backend:
    name: Backend — syntax + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install minimal deps
        # Just enough to import the models + schemas packages.
        # pydantic-settings ships separately from pydantic in v2, and
        # config.py imports BaseSettings from it — leaving it out failed the
        # import step before it reached a single model.
        run: |
          pip install \
            'sqlalchemy[asyncio]>=2.0.30' \
            'pydantic>=2.7.0' \
            'pydantic[email]>=2.7.0' \
            'pydantic-settings>=2.2.0' \
            'asyncpg>=0.29.0' \
            'fastapi>=0.111.0'

      - name: AST parse every Python file under backend/
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          for p in pathlib.Path('backend').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  bad += 1
                  print(f'SYNTAX ERR {p}: {e}', file=sys.stderr)
          if bad:
              sys.exit(1)
          print('All backend Python files parse cleanly.')
          PY

      - name: Import-smoke the models + schemas packages
        # Stub DATABASE_URL etc. — config.py reads env at import time.
        env:
          DATABASE_URL: postgresql+asyncpg://x:x@localhost:5432/x
          TIMESCALE_URL: postgresql+asyncpg://x:x@localhost:5432/x
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-stub-secret-1234567890123456789012
          USER_JWT_SECRET: ci-stub-secret-1234567890123456789012
          ADMIN_JWT_SECRET: ci-stub-secret-1234567890123456789012
        run: |
          export PYTHONPATH=backend
          python - <<'PY'
          # Verify every legacy import name still resolves through the new packages.
          from packages.common.src.models import (
              Base,
              OrderType, OrderSide, OrderStatus, PositionStatus, AllocationCopyType,
              order_type_enum, order_side_enum, order_status_enum, position_status_enum,
              User, UserSession, PasswordResetToken, UserRefreshToken, KYCDocument,
              IPLog, AuditLog, UserAuditLog, Employee,
              InstrumentSegment, Instrument, InstrumentConfig, InstrumentConfigAudit,
              AccountGroup, TradingAccount, Order, Position, TradeHistory,
              BankAccount, Deposit, Withdrawal, Transaction,
              ChargeConfig, SpreadConfig, SwapConfig,
              IBProfile, IBApplication, IBCommissionPlan, IBCommission, Referral,
              MasterAccount, InvestorAllocation, CopyTrade,
              SupportTicket, TicketMessage, Notification, Banner,
              SystemSetting, BonusOffer, UserBonus,
              InsurancePolicy, InsuranceClaim,
              RewardsUserState, RewardsMission, RewardsUserMissionProgress,
              RewardStoreItem, RewardsTransaction,
              SharedTrade,
          )
          from packages.common.src.schemas import (
              RegisterRequest, LoginRequest, ForgotPasswordRequest, ResetPasswordRequest,
              BootstrapSessionRequest, OpenLiveAccountRequest,
              TokenResponse, UserResponse, MessageResponse,
              TradingAccountResponse, AccountSummary,
              PlaceOrderRequest, ModifyOrderRequest, OrderResponse,
              PositionResponse, ClosePositionRequest, ModifyPositionRequest,
              DepositRequest, WithdrawalRequest,
              TransferTradingToMainRequest, TransferMainToTradingRequest,
              InternalWalletTransferRequest,
              DepositResponse, WithdrawalResponse, BankAccountCreate,
              TickData, OHLCVBar, InstrumentResponse,
              AdminFundAdjustment, AdminTradeCreate, AdminModifyTrade,
              PaginationParams, PaginatedResponse,
              InsuranceQuoteRequest, InsuranceTierQuote,
              InsuranceActivateRequest, InsuranceActivateResponse,
              InsurancePolicyOut, InsuranceClaimOut,
          )
          # Confirm SQLAlchemy registered every ORM table.
          tables = sorted(Base.metadata.tables.keys())
          print(f'{len(tables)} ORM tables registered:')
          for t in tables:
              print(f'  - {t}')
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one broken app should not hide the others
      matrix:
        # Package manager per app, because they genuinely differ: landing is on
        # yarn and the other three on npm. CI installs the way each app's
        # Dockerfile does, so a green run means the dependency tree that
        # production will actually build.
        include:
          - app: trader
            pm: npm
            lock: package-lock.json
          - app: admin
            pm: npm
            lock: package-lock.json
          - app: ib
            pm: npm
            lock: package-lock.json
          - app: landing
            pm: yarn
            lock: yarn.lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ matrix.pm }}
          cache-dependency-path: frontend/${{ matrix.app }}/${{ matrix.lock }}

      - name: Install dependencies
        working-directory: frontend/${{ matrix.app }}
        run: |
          if [ "${{ matrix.pm }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci --legacy-peer-deps
          fi

      # tsc and next build both exhaust Node's default heap on the larger apps
      # and die with SIGABRT (exit 134), which reads like a compile failure but
      # is not one.
      - name: Typecheck
        working-directory: frontend/${{ matrix.app }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx tsc --noEmit

      # Typecheck alone is not enough: a missing field on a content object
      # typechecks clean and still breaks the page at build time.
      - name: Build
        working-directory: frontend/${{ matrix.app }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx next build

      # Only the trader app has tests today.
      - name: Unit tests
        if: matrix.app == 'trader'
        working-directory: frontend/trader
        run: npx vitest run

# Not run here, deliberately: `next lint`. No app has an ESLint config, so it
# drops into an interactive setup prompt and would hang the runner. Worth
# adding once a config exists.
