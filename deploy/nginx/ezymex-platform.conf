# Ezymex production edge on nginx (servers where nginx already owns :80/:443, behind Cloudflare with an origin
# certificate). Same routes as deploy/Caddyfile. Installed by deploy.sh as /etc/nginx/sites-enabled/ezymex-platform.conf
# next to /etc/nginx/snippets/ezymex-proxy.conf. The apex ezymex.com (marketing site) is served elsewhere.

map $http_upgrade $ezymex_connection {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name app.ezymex.com trade.ezymex.com admin.ezymex.com api.ezymex.com ib.ezymex.com;
	return 301 https://$host$request_uri;
}

# Client Area (CRM). /support/stream = support chat + notifications stream (one-time ticket from the CRM BFF).
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name app.ezymex.com;
	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;
	client_max_body_size 25m;

	location = /support/stream {
		rewrite ^ /v1/stream break;
		proxy_pass http://127.0.0.1:8100;
		include snippets/ezymex-proxy.conf;
	}
	# support chat attachments: 10 MB files; the support service enforces the exact limit and sniffs the type
	location = /api/support/attachments {
		client_max_body_size 11m;
		proxy_pass http://127.0.0.1:3000;
		include snippets/ezymex-proxy.conf;
	}
	# KYC uploads: 10 MB files (+ multipart overhead); the gateway enforces the exact limit and sniffs the type
	location = /api/kyc/documents {
		client_max_body_size 12m;
		proxy_pass http://127.0.0.1:3000;
		include snippets/ezymex-proxy.conf;
	}
	# The Android app (APK) and other downloads: static files uploaded to the server, outside git
	location /download/ {
		alias /srv/ezymex/downloads/;
		types { application/vnd.android.package-archive apk; }
		add_header Content-Disposition "attachment" always;
		add_header X-Content-Type-Options "nosniff" always;
	}
	location / {
		proxy_pass http://127.0.0.1:3000;
		include snippets/ezymex-proxy.conf;
	}
}

# Ezymex Trader. /engine/stream = trading-engine account stream (one-time ticket from the terminal BFF);
# /options/stream = options chain stream (one-time ticket from the terminal BFF, or the guest public chain).
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name trade.ezymex.com;
	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;
	client_max_body_size 25m;

	location = /engine/stream {
		rewrite ^ /v1/terminal/stream break;
		proxy_pass http://127.0.0.1:8090;
		include snippets/ezymex-proxy.conf;
	}
	location = /options/stream {
		rewrite ^ /v1/options/stream break;
		proxy_pass http://127.0.0.1:8104;
		include snippets/ezymex-proxy.conf;
	}
	# the marketing site's (ezymex.com) sign-in / sign-up buttons still point at the previous trader's pages
	location = /auth/login {
		return 302 https://app.ezymex.com/login;
	}
	location = /auth/register {
		return 302 https://app.ezymex.com/register;
	}
	location / {
		proxy_pass http://127.0.0.1:3002;
		include snippets/ezymex-proxy.conf;
	}
}

# Back Office. /engine/stream = trading-engine dealing stream (one-time ticket from the admin BFF);
# /support/stream = support inbox + staff notifications stream (one-time ticket from the admin BFF).
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name admin.ezymex.com;
	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;
	client_max_body_size 25m;

	location = /support/stream {
		rewrite ^ /v1/stream break;
		proxy_pass http://127.0.0.1:8100;
		include snippets/ezymex-proxy.conf;
	}
	location = /engine/stream {
		rewrite ^ /v1/dealing/stream break;
		proxy_pass http://127.0.0.1:8090;
		include snippets/ezymex-proxy.conf;
	}
	location / {
		proxy_pass http://127.0.0.1:3001;
		include snippets/ezymex-proxy.conf;
	}
}

# Public market data (quotes, candles, WebSocket stream). Admin endpoints are never exposed.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name api.ezymex.com;
	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;

	# ALGO public surface only: webhook alerts and the API-key REST API (everything else needs the internal token)
	location /algo/ {
		return 404;
	}
	location /algo/hooks/ {
		client_max_body_size 64k;
		rewrite ^/algo(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:8099;
		include snippets/ezymex-proxy.conf;
	}
	location /algo/public/v1/ {
		client_max_body_size 64k;
		rewrite ^/algo(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:8099;
		include snippets/ezymex-proxy.conf;
	}
	# Ezymex FX Options public chain (read-only; the service answers 404 until the public chain is switched on)
	location /v1/public/options/ {
		proxy_pass http://127.0.0.1:8104;
		include snippets/ezymex-proxy.conf;
	}
	# admin (spreads) and internal (service-to-service) endpoints stay on the server
	location /v1/admin {
		return 404;
	}
	location /v1/internal {
		return 404;
	}
	location / {
		proxy_pass http://127.0.0.1:8081;
		include snippets/ezymex-proxy.conf;
	}
}

# The previous IB portal host: partners now live in the Client Area.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name ib.ezymex.com;
	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
	return 302 https://app.ezymex.com/partner;
}
