# Shared reverse-proxy settings for the Ezymex apps and services (installed as /etc/nginx/snippets/ezymex-proxy.conf).
# The real client IP comes from Cloudflare (conf.d/cloudflare-real-ip.conf), so X-Forwarded-For carries it alone and a
# client can't prepend its own value.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $ezymex_connection;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
