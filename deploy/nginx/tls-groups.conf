# Pin the TLS key-exchange groups to classical curves.
# Install at /etc/nginx/conf.d/tls-groups.conf (applies to every server block).
#
# Why this file exists
# --------------------
# On OpenSSL 3.5+ (Ubuntu 26.04 and newer) the default group list leads with
# the post-quantum hybrid X25519MLKEM768. Cloudflare's origin-pull client
# offers X25519, so nginx replied with a HelloRetryRequest demanding the PQ
# group; the retry failed, the origin sent a TLS alert and closed the
# connection, and Cloudflare surfaced that to every visitor as
#
#     error 525 (SSL handshake failed)
#
# The trap is that the origin looks perfectly healthy while this happens:
# `openssl s_client` and a browser hitting the origin IP directly both
# complete the handshake, because they negotiate X25519 without a retry.
# Only the Cloudflare edge trips it, and nginx logs NOTHING -- the failure is
# below the HTTP layer, so there is no access-log or error-log entry to find.
# It was diagnosed from a packet capture: HelloRetryRequest out, big
# ClientHello in, 7-byte alert out, FIN.
#
# Keep this installed on any Cloudflare-fronted origin running OpenSSL >= 3.5.
ssl_ecdh_curve X25519:prime256v1:secp384r1;
