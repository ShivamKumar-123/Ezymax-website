# Matches a 401/403/429 response on any /api/v1/auth/* POST in the nginx
# access log. 429 (rate-limited) counts too — a client hammering the auth
# endpoints hard enough to trip the app rate limiter is exactly what this
# jail exists to ban. fail2ban substitutes <HOST> with the leading IP from
# $remote_addr, which after cloudflare-real-ip.conf is the real client.
[Definition]
failregex = ^<HOST> .*"POST /api/v1/auth/(login|register|verify-otp|forgot-password|reset-password)[^"]*" (401|403|429)
ignoreregex =
