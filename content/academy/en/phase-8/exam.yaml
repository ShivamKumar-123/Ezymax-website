pass_mark: 70
questions:
  - question: "Growth indicators are deteriorating while core inflation is rising. Which regime is this, and what is the typical problem for central banks?"
    options: ["Goldilocks; they can cut freely", "Reflation; they must cut", "Stagflation; fighting inflation risks deepening the slowdown", "Disinflationary slowdown; they must hike"]
    answer: 2
    explanation: "Falling growth with rising inflation is stagflation. Tightening fights inflation but hurts growth further, while easing risks entrenching inflation."
    chapter: "p8-f-business-cycle-regimes"
  - question: "A 10-year nominal yield rises from 4.00% to 4.20% while breakeven inflation rises from 2.20% to 2.60%. What happened to the real yield?"
    options: ["It rose by 0.20 points", "It fell from 1.80% to 1.60%", "It was unchanged", "It rose from 1.80% to 2.20%"]
    answer: 1
    explanation: "Real yield moved from 4.00 - 2.20 = 1.80% to 4.20 - 2.60 = 1.60%. Nominal yields rose, but real yields fell by 0.20 points, which is usually supportive for gold."
    chapter: "p8-f-inflation-regimes"
  - question: "In a high and volatile inflation regime, why might long SPX500 and long government bonds fail to diversify each other?"
    options: ["Inflation surprises push yields up and hurt both bonds and equity valuations", "Bonds stop trading", "Equities become risk-free", "Central banks buy all equities"]
    answer: 0
    explanation: "When inflation is the dominant shock, rising yields lower bond prices and raise equity discount rates at the same time, so the stock-bond correlation tends to turn positive."
    chapter: "p8-f-inflation-regimes"
  - question: "A central bank signals one rate cut this year, while futures had priced two. What is the most likely first reaction in its currency?"
    options: ["It weakens, because the bank is cutting", "No reaction, because a cut is a cut", "It strengthens, because policy is less dovish than priced", "It always follows gold"]
    answer: 2
    explanation: "Markets trade surprises relative to pricing. One cut instead of the two priced is a hawkish surprise, which tends to support the currency."
    chapter: "p8-f-monetary-cycles-qe-qt"
  - question: "How does quantitative tightening usually differ from quantitative easing in practice?"
    options: ["QT is always faster than QE", "QT usually lets bonds mature without reinvestment and proceeds more slowly than crisis QE", "QT involves buying equities", "QT lowers long-term yields"]
    answer: 1
    explanation: "Balance sheets expand quickly in emergencies but shrink gradually through run-off, because rapid tightening can strain funding markets."
    chapter: "p8-f-monetary-cycles-qe-qt"
  - question: "After a geopolitical headline, oil spikes but it becomes clear that no supply has been lost. What has historically been the more common outcome?"
    options: ["Oil keeps rising for a year", "Commodity currencies collapse permanently", "Safe-haven currencies weaken immediately", "Much of the initial move retraces within days or weeks"]
    answer: 3
    explanation: "Without a lasting supply or activity effect, the risk premium added in the first reaction tends to fade. Moves become lasting trends when physical supply or trade is actually disrupted."
    chapter: "p8-f-geopolitics-commodity-shocks"
  - question: "Which statement best describes the dollar smile?"
    options: ["The dollar tends to rise in global crises and during US outperformance, and weaken during synchronised global growth", "The dollar only rises when US rates fall", "The dollar is always weakest in recessions", "The dollar follows oil one for one"]
    answer: 0
    explanation: "The two ends of the smile are risk aversion and US outperformance; the bottom is broad global growth, when capital flows out of the US."
    chapter: "p8-f-long-term-currency-cycles"
  - question: "Your scenarios for a trade are +3% with 60% probability and -6% with 40% probability. What is the expected move and what does it suggest?"
    options: ["+1.8%, a strong trade", "+0.6%, favourable at any size", "-0.6%, the trade has negative expected value on these assumptions", "0%, a neutral trade"]
    answer: 2
    explanation: "0.60 x 3 + 0.40 x (-6) = 1.8 - 2.4 = -0.6%. Despite a higher probability of winning, the larger downside makes the expected value negative."
    chapter: "p8-f-macro-view-scenario-planning"
  - question: "In a D1-H4-H1 system, the D1 regime is bearish but a clean bullish H1 trigger appears. What should a well-designed system do?"
    options: ["Take the long at full size", "Take the long at double size", "Switch the regime to bullish", "Take no trade, because the regime filter does not allow longs"]
    answer: 3
    explanation: "Each layer filters the one below. A trigger against the higher-timeframe regime is ignored unless the written rules explicitly allow counter-trend trades."
    chapter: "p8-t-multi-timeframe-systems"
  - question: "Three strategies show monthly volatility of 8%, 4% and 2% at the same risk per trade. Under equal-volatility allocation, which gets the largest risk per trade?"
    options: ["The 2% volatility strategy", "The 8% volatility strategy", "The 4% volatility strategy", "All receive equal risk"]
    answer: 0
    explanation: "Risk is scaled inversely to volatility, so the least volatile strategy receives the most risk per trade to equalise contributions."
    chapter: "p8-t-strategy-portfolio-allocation"
  - question: "A strategy's gross expectancy is 3 pips per trade. Spread is 1.0 pip, commission is equivalent to 0.7 pips and slippage averages 0.5 pips. What share of the gross edge do costs consume?"
    options: ["About 40%", "About 73%", "About 22%", "100%"]
    answer: 1
    explanation: "Total cost is 1.0 + 0.7 + 0.5 = 2.2 pips, and 2.2 / 3 = 73%. Net expectancy is only 0.8 pips, leaving the strategy very sensitive to any cost increase."
    chapter: "p8-t-execution-quality"
  - question: "A trader holds 1.00 lot EURUSD long from 1.0850 with a stop at 1.0820 and wants to add 0.50 lot at 1.0890. Where must the combined stop be for the worst case to be breakeven? (10 USD per pip per lot)"
    options: ["1.0820", "1.0850", "1.0877", "About 1.0863"]
    answer: 3
    explanation: "Average entry = (1.0850 x 1.00 + 1.0890 x 0.50) / 1.50 = 1.08633. A stop at about 1.0863 closes the combined 1.50 lots at roughly breakeven."
    chapter: "p8-t-scaling-positions-capital"
  - question: "A prop challenge has a static 10% maximum loss on 100,000 USD. Equity reaches 108,000 and then falls to 95,000. What is the status?"
    options: ["Breached, because equity fell 13,000 from the peak", "Not breached, because equity is still above the 90,000 floor", "Breached, because equity is below 100,000", "Not breached, because floating losses never count"]
    answer: 1
    explanation: "A static floor stays at 90,000 regardless of the peak. Under a 10% trailing rule the floor would have risen to 98,000 (108,000 - 10,000), and the account would have been breached."
    chapter: "p8-t-prop-firm-readiness"
  - question: "A copy-trading provider's record shows a 95% win rate, very small average wins and positions held for weeks without stops. What is the most reasonable interpretation?"
    options: ["It is likely to carry hidden tail risk, such as averaging down or martingale exposure", "It is the safest strategy available", "It guarantees future returns", "Win rate is the only metric that matters"]
    answer: 0
    explanation: "Very high win rates with small wins and no stops are typical of strategies that hold or add to losers. The record can look smooth until one large adverse move."
    chapter: "p8-t-copy-trading-pamm"
  - question: "Your monthly review shows a profitable month, but only 70% of trades followed the written rules. What is the professional conclusion?"
    options: ["The rules should be discarded because breaking them made money", "Nothing, because the month was profitable", "It is a warning sign: results did not come from the tested process, and adherence must be fixed", "Increase risk per trade next month"]
    answer: 2
    explanation: "Process metrics matter because profits from rule breaks are not repeatable evidence. Low adherence makes the strategy's statistics unreliable."
    chapter: "p8-t-professional-routines-review"
